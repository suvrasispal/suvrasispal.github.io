/* =====================================================================
   VIEW: CALENDAR
   ===================================================================== */
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW_NAMES = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

function eventsOnDate(y,m,d){
  return EVENTS.filter(e=> e._date.getFullYear()===y && e._date.getMonth()===m && e._date.getDate()===d && passesFilter(e));
}
function eventsInMonth(y,m){
  return EVENTS.filter(e=> e._date.getFullYear()===y && e._date.getMonth()===m && passesFilter(e));
}

function renderCalendar(){
  const el = document.getElementById("view-calendar");
  const today = startOfToday();

  // Keep the calendar inside the same rolling 12-month period as the rest
  // of the dashboard — there's nothing generated beyond it to show anyway.
  const minY = calWindowStart.getFullYear(), minM = calWindowStart.getMonth();
  const maxY = calWindowEnd.getFullYear(), maxM = calWindowEnd.getMonth();
  const atMin = calMode==="month" ? (calYear<minY || (calYear===minY && calMonth<=minM)) : calYear<=minY;
  const atMax = calMode==="month" ? (calYear>maxY || (calYear===maxY && calMonth>=maxM)) : calYear>=maxY;

  const header = `
    <div class="cal-header">
      <button class="cal-nav-btn" id="calPrev" ${atMin?'disabled style="opacity:.35;cursor:not-allowed;"':''}>${ICONS.chevronL}</button>
      <div class="cal-title">${calMode==='month' ? MONTH_NAMES[calMonth]+" "+calYear : calYear}</div>
      <button class="cal-nav-btn" id="calNext" ${atMax?'disabled style="opacity:.35;cursor:not-allowed;"':''}>${ICONS.chevronR}</button>
      <button class="today-btn" id="calToday">Today</button>
      <div class="cal-mode-toggle">
        <button data-mode="month" class="${calMode==='month'?'active':''}">Month</button>
        <button data-mode="year" class="${calMode==='year'?'active':''}">Year</button>
      </div>
      <span class="section-sub" style="white-space:nowrap;">📅 Showing ${fmtDateShort(calWindowStart)} ${calWindowStart.getFullYear()} – ${fmtDateShort(calWindowEnd)} ${calWindowEnd.getFullYear()}</span>
    </div>`;

  let body = "";
  if(calMode==="month"){
    const first = new Date(calYear, calMonth, 1);
    const startOffset = (first.getDay()+6)%7; // Monday=0
    const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
    const prevDays = new Date(calYear, calMonth, 0).getDate();

    let cells = "";
    for(let i=0;i<startOffset;i++){
      const dayNum = prevDays-startOffset+1+i;
      cells += `<div class="day-cell out"><div class="day-num">${dayNum}</div></div>`;
    }
    for(let day=1; day<=daysInMonth; day++){
      const isToday = today.getFullYear()===calYear && today.getMonth()===calMonth && today.getDate()===day;
      const evs = eventsOnDate(calYear, calMonth, day);
      const pills = evs.slice(0,3).map(ev=>{
        const c = CATEGORIES[ev.category];
        return `<div class="day-pill" style="--cat-color:${c.color}" data-open="${ev.id}" title="${ev.name}">${c.emoji}<span class="txt">${ev.name}</span></div>`;
      }).join("");
      const more = evs.length>3 ? `<div class="day-more">+${evs.length-3} more</div>` : "";
      cells += `<div class="day-cell ${isToday?'today':''}" data-day="${day}">
        <div class="day-num">${day}</div>
        <div class="day-events">${pills}${more}</div>
      </div>`;
    }
    const totalCells = startOffset + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for(let i=1;i<=trailing;i++){
      cells += `<div class="day-cell out"><div class="day-num">${i}</div></div>`;
    }

    body = `<div class="month-grid">
      ${DOW_NAMES.map(d=>`<div class="dow">${d}</div>`).join("")}
      ${cells}
    </div>`;
  } else {
    body = `<div class="year-grid">
      ${MONTH_NAMES.map((name,m)=>{
        const evs = eventsInMonth(calYear, m);
        const first = new Date(calYear, m, 1);
        const startOffset = (first.getDay()+6)%7;
        const daysInMonth = new Date(calYear, m+1, 0).getDate();
        let dayCells = "";
        for(let i=0;i<startOffset;i++) dayCells += `<div class="mini-day out"></div>`;
        for(let day=1; day<=daysInMonth; day++){
          const dEvs = eventsOnDate(calYear, m, day);
          const hasHigh = dEvs.some(e=>e.priority==="high");
          dayCells += `<div class="mini-day ${dEvs.length? (hasHigh?'has-high':'has-event'):''}"></div>`;
        }
        return `<div class="mini-month" data-jump-month="${m}">
          <h4>${name}</h4>
          <div class="mini-month-grid">${dayCells}</div>
          <div class="mini-month-count">${evs.length} event${evs.length===1?'':'s'}</div>
        </div>`;
      }).join("")}
    </div>`;
  }

  el.innerHTML = header + `<div class="legend-row">${Object.values(CATEGORIES).map(c=>`<span class="legend-item"><span class="dot" style="--cat-color:${c.color}"></span>${c.emoji} ${c.label}</span>`).join("")}</div>` + body;

  el.querySelectorAll("[data-open]").forEach(p=>{
    p.addEventListener("click",(ev)=>{ ev.stopPropagation(); openDrawer(p.dataset.open); });
  });
  el.querySelectorAll(".day-cell[data-day]").forEach(cell=>{
    cell.addEventListener("click", ()=>{
      const day = parseInt(cell.dataset.day,10);
      const evs = eventsOnDate(calYear, calMonth, day);
      // exactly one event: open it directly. Multiple: each has its own
      // clickable pill (handled above with stopPropagation), so a click on
      // the empty part of the cell does nothing rather than guessing which.
      if(evs.length===1) openDrawer(evs[0].id);
    });
  });
  el.querySelectorAll("[data-jump-month]").forEach(m=>{
    m.addEventListener("click", ()=>{ calMonth = parseInt(m.dataset.jumpMonth,10); calMode="month"; renderCalendar(); });
  });
  document.getElementById("calPrev").addEventListener("click", ()=>{
    if(atMin) return;
    if(calMode==="month"){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} } else { calYear--; }
    renderCalendar();
  });
  document.getElementById("calNext").addEventListener("click", ()=>{
    if(atMax) return;
    if(calMode==="month"){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} } else { calYear++; }
    renderCalendar();
  });
  document.getElementById("calToday").addEventListener("click", ()=>{
    const t = startOfToday(); calYear=t.getFullYear(); calMonth=t.getMonth(); calMode="month"; renderCalendar();
  });
  el.querySelectorAll("[data-mode]").forEach(b=>{
    b.addEventListener("click", ()=>{ calMode=b.dataset.mode; renderCalendar(); });
  });
}

/* =====================================================================
   VIEW: TASKS
   ===================================================================== */
function renderTasks(){
  const el = document.getElementById("view-tasks");
  const list = sortedByDate(EVENTS.filter(e=> passesFilter(e) && !isDoneStatus(eventState[e.id].status) && daysUntil(e) >= -60));

  // auto-expand anything needing action, first time only
  if(expandedTasks.size===0){
    list.filter(isActionRequired).forEach(e=>expandedTasks.add(e.id));
  }

  el.innerHTML = `
    <div class="section-head"><h2>Open Tasks <span class="count-pill">${list.length}</span></h2><span class="section-sub">Assign each task to a team member — status &amp; progress update automatically</span></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-ghost btn-sm" id="expandAllTasks">Expand all</button>
      <button class="btn btn-ghost btn-sm" id="collapseAllTasks">Collapse all</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      ${list.length ? list.map(ev=>{
        const st = eventState[ev.id];
        const open = expandedTasks.has(ev.id);
        const urgent = isActionRequired(ev);
        return `<div class="task-row ${urgent?'urgent':''}" style="${urgent?'border-left:4px solid var(--red);':''}">
          <div class="task-row-head" data-toggle="${ev.id}" style="cursor:pointer;">
            <div class="task-row-title">${CATEGORIES[ev.category].emoji} ${ev.name} <span class="section-sub tabular">— ${fmtDateShort(ev._date)} · ${countdownLabel(ev)}</span></div>
            <div style="display:flex;align-items:center;gap:10px;">
              ${statusPill(st.status)}
              <span class="task-frac">${tasksDone(ev.id)}/${tasksTotal(ev.id)} · ${pctDone(ev.id)}%</span>
              <button class="icon-btn" style="display:flex;width:40px;height:40px;" data-open="${ev.id}" title="Open full details">${ICONS.chevronR}</button>
            </div>
          </div>
          <div class="mini-progress"><span style="width:${pctDone(ev.id)}%"></span></div>
          ${open ? `<div style="display:flex;flex-direction:column;gap:4px;">
            ${ev.tasks.map((t,i)=>taskLineHTML(ev.id, i)).join("")}
          </div>` : ""}
        </div>`;
      }).join("") : `<div class="empty-state"><span class="emoji">🎉</span>No open tasks match the current filters.</div>`}
    </div>`;
  attachCardOpeners(el);
  wireTaskLineEvents(el);
  el.querySelectorAll("[data-toggle]").forEach(row=>{
    row.addEventListener("click", ()=>{
      const id = row.dataset.toggle;
      if(expandedTasks.has(id)) expandedTasks.delete(id); else expandedTasks.add(id);
      renderTasks();
    });
  });
  document.getElementById("expandAllTasks").addEventListener("click", ()=>{ list.forEach(e=>expandedTasks.add(e.id)); renderTasks(); });
  document.getElementById("collapseAllTasks").addEventListener("click", ()=>{ expandedTasks.clear(); renderTasks(); });
}

/* =====================================================================

   ===================================================================== */
function openDrawer(id){
  openDrawerId = id;
  renderDrawer();
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawerOverlay").classList.add("open");
}
function closeDrawer(){
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("drawerOverlay").classList.remove("open");
  openDrawerId = null;
}
function renderDrawer(){
  if(!openDrawerId) return;
  const ev = EVENT_BY_ID[openDrawerId];
  const st = eventState[openDrawerId];
  const drawer = document.getElementById("drawer");
  const n = daysUntil(ev);

  drawer.innerHTML = `
    <div class="drawer-head">
      <button class="drawer-close" id="drawerCloseBtn">${ICONS.close}</button>
      ${catBadge(ev)}
      <h2>${ev.name}</h2>
      <div class="dh-meta">
        <div>Date<b>${fmtDate(ev._date)}</b></div>
        <div>Countdown<b>${countdownLabel(ev)}</b></div>
        <div>Prep deadline<b>${fmtDateShort(prepDate(ev))}</b></div>
        <div>Priority<b>${ev.priority[0].toUpperCase()+ev.priority.slice(1)}</b></div>
        <div>Recurrence<b>${ev._recurring===false?'📌 One-off':'🔁'} ${recurrenceLabel(ev.recurrence)}</b></div>
      </div>
    </div>
    <div class="drawer-body">
      ${isAdmin() ? `
      <div class="drawer-section" style="display:flex;gap:10px;padding-top:0;">
        <button class="btn btn-ghost btn-sm" id="editEventBtn">✏️ Edit event</button>
        <button class="link-btn" id="deleteEventBtn" style="color:var(--red);">🗑️ Delete event</button>
      </div>` : ""}
      <div class="drawer-section">
        <label class="field-label">Description &amp; purpose</label>
        <p class="body-text">${ev.description}</p>
      </div>
      <div class="drawer-section">
        <label class="field-label">Marketing requirements</label>
        <p class="body-text">${ev.requirements}</p>
      </div>
      <div class="drawer-section">
        <label class="field-label">Project status</label>
        <div class="status-grid">
          ${STATUSES.map(s=>`<button class="status-btn ${st.status===s.key?'active':''}" style="--st-color:${s.color}" data-status="${s.key}"><span class="sdot"></span>${s.key}</button>`).join("")}
        </div>
      </div>
      <div class="drawer-section">
        <div class="progress-summary"><label class="field-label" style="margin:0;">Task tracker</label><b class="tabular">${tasksDone(ev.id)} / ${tasksTotal(ev.id)} — ${pctDone(ev.id)}%</b></div>
        <div class="big-progress"><span style="width:${pctDone(ev.id)}%"></span></div>
        <div style="display:flex;flex-direction:column;gap:4px;">
          ${ev.tasks.map((t,i)=>taskLineHTML(ev.id, i)).join("")}
        </div>
      </div>
      <div class="drawer-section">
        <label class="field-label" for="assigneeInput">Campaign lead</label>
        <input class="field-input" list="assigneeOptions" id="assigneeInput" value="${st.assignedTo}">
        <datalist id="assigneeOptions">${ASSIGNEE_OPTIONS.map(a=>`<option value="${a}">`).join("")}</datalist>
      </div>
      <div class="drawer-section">
        <label class="field-label" for="notesInput">Notes</label>
        <textarea class="field-textarea" id="notesInput" placeholder="Add planning notes, links, or context for the team…">${st.notes}</textarea>

  `;

  document.getElementById("drawerCloseBtn").addEventListener("click", closeDrawer);
  drawer.querySelectorAll("[data-status]").forEach(btn=>{

  wireTaskLineEvents(drawer);
  document.getElementById("assigneeInput").addEventListener("change", (e)=> setAssignee(ev.id, e.target.value));
  document.getElementById("notesInput").addEventListener("blur", (e)=> setNotes(ev.id, e.target.value));

  document.getElementById("deleteEventBtn")?.addEventListener("click", ()=>{

/* =====================================================================
   VIEW: MY TASKS (team member's own queue, or the admin's team-wide board)
   ===================================================================== */
function renderMyTasks(){
  const el = document.getElementById("view-mytasks");
  const all = allTasksFlat();

  if(!isAdmin()){
    const mine = all.filter(x=> x.t.assignedTo===currentUser).sort((a,b)=>a.ev._date-b.ev._date);
    el.innerHTML = `
      <div class="section-head"><h2>🙋 My Tasks <span class="count-pill">${mine.length}</span></h2><span class="section-sub">Everything currently assigned to ${currentUser}</span></div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        ${mine.length ? mine.map(({ev,idx})=>`
          <div class="task-row">
            <div class="task-row-head" style="cursor:default;">
              <div class="task-row-title">${CATEGORIES[ev.category].emoji} ${ev.name} <span class="section-sub tabular">— ${fmtDate(ev._date)} · ${countdownLabel(ev)}</span></div>
              <div style="display:flex;align-items:center;gap:10px;">
                ${priorityFlag(ev)}
                <button class="icon-btn" style="display:flex;width:40px;height:40px;" data-open="${ev.id}" title="Open full event details">${ICONS.chevronR}</button>
              </div>
            </div>
            ${taskLineHTML(ev.id, idx)}
          </div>`).join("")
        : `<div class="empty-state"><span class="emoji">🎉</span>Nothing assigned to you right now — check back after your admin assigns new tasks.</div>`}
      </div>`;
  } else {
    // "Open" mirrors the Tasks view's own window (not done, not ancient) so
    // this board doesn't dump hundreds of far-future tasks at once.
    const openOnly = all.filter(x=> x.t.status!=="Completed" && !isDoneStatus(eventState[x.ev.id].status) && daysUntil(x.ev) >= -60);
    const unassignedAll = openOnly.filter(x=> !x.t.assignedTo);
    const unassignedUrgent = unassignedAll.filter(x=> isActionRequired(x.ev)).sort((a,b)=>a.ev._date-b.ev._date).slice(0,20);
    const byPerson = {};
    openOnly.forEach(x=>{ if(x.t.assignedTo){ (byPerson[x.t.assignedTo] = byPerson[x.t.assignedTo] || []).push(x); } });
    const people = Object.keys(byPerson).sort();

    el.innerHTML = `
      <div class="section-head"><h2>🗂️ Team Task Board</h2><span class="section-sub">Assigned work by team member, plus the nearest-deadline unassigned tasks</span></div>
      ${unassignedAll.length ? `
      <div class="drawer-section" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;margin-top:12px;">
        <label class="field-label">⚠️ Unassigned open tasks — ${unassignedAll.length} in total</label>
        ${unassignedUrgent.length ? `
        <div style="display:flex;flex-direction:column;gap:4px;margin-top:8px;">
          ${unassignedUrgent.map(({ev,idx})=>taskLineHTML(ev.id, idx)).join("")}
        </div>` : `<p class="section-sub" style="margin-top:6px;">None are urgent yet — open the <b>Tasks</b> view to get ahead and assign them early.</p>`}
        ${unassignedAll.length > unassignedUrgent.length ? `<p class="section-sub" style="margin-top:8px;">+ ${unassignedAll.length - unassignedUrgent.length} more not yet in their prep window — assign these from the <b>Tasks</b> view.</p>` : ""}
      </div>` : ""}
      ${people.length ? people.map(person=>`
        <div style="margin-top:20px;">
          <div class="section-head"><h2 style="font-size:1rem;">👤 ${person} <span class="count-pill">${byPerson[person].length}</span></h2></div>
          <div style="display:flex;flex-direction:column;gap:4px;margin-top:8px;">
            ${byPerson[person].sort((a,b)=>a.ev._date-b.ev._date).map(({ev,idx})=>taskLineHTML(ev.id, idx)).join("")}
          </div>
        </div>`).join("") : ""}
      ${!people.length && !unassignedAll.length ? `<div class="empty-state" style="margin-top:12px;"><span class="emoji">🎉</span>No open tasks right now — everything's assigned and complete.</div>` : ""}
    `;
  }
  attachCardOpeners(el);
  wireTaskLineEvents(el);
}

/* =====================================================================
   MASTER RENDER
   ===================================================================== */
function renderAll(){
  rebuildEvents(); // cheap; keeps "today" and the rolling 12-month window always current
  buildNav();
  document.querySelectorAll(".view").forEach(v=> v.classList.toggle("active", v.dataset.view===currentView));
  if(currentView==="dashboard") renderDashboard();
  else if(currentView==="calendar") renderCalendar();
  else if(currentView==="upcoming") renderUpcoming();
  else if(currentView==="tasks") renderTasks();
  else if(currentView==="mytasks") renderMyTasks();
  else if(currentView==="campaigns") renderCampaigns();
  else if(currentView==="completed") renderCompleted();
  if(openDrawerId) renderDrawer();
}

/* =====================================================================
   EXPORT TO EXCEL — an on-demand, point-in-time .xlsx snapshot of every
   event and task, for sharing outside the dashboard or keeping a record.
   This is deliberately a SNAPSHOT, not a live link: the dashboard's own
   shared save (see the sync-status pill) is what stays live across
   browsers/devices — this button just captures "right now" into a file.
   ===================================================================== */
function buildExportWorkbook(){
  const eventRows = EVENTS.map(ev=>{
    const st = eventState[ev.id];
    const { distinct } = eventAssignmentInfo(ev);
    return {
      "Event": ev.name,
      "Category": (CATEGORIES[ev.category] && CATEGORIES[ev.category].label) || ev.category,
      "Priority": ev.priority.charAt(0).toUpperCase() + ev.priority.slice(1),
      "Date": fmtDate(ev._date),
      "Recurs": ev._recurring===false ? "One-off" : recurrenceLabel(ev.recurrence),
      "Prep starts": fmtDate(prepDate(ev)),
      "Project status": st.status,
      "Tasks completed": tasksDone(ev.id),
      "Tasks total": tasksTotal(ev.id),
      "% complete": tasksTotal(ev.id) ? pctDone(ev.id) : 0,
      "Assigned to": distinct.join(", ") || "Unassigned",
      "Campaign lead": st.assignedTo || "Unassigned",
      "Notes": st.notes || "",
    };
  });
  const taskRows = [];
  EVENTS.forEach(ev=>{
    const st = eventState[ev.id];
    ev.tasks.forEach((label, idx)=>{
      const t = st.tasks[idx];
      taskRows.push({
        "Event": ev.name,
        "Event date": fmtDate(ev._date),
        "Task": label,
        "Task status": t.status,
        "Assigned to": t.assignedTo || "Unassigned",
        "Note": t.note || "",
        "Last updated": t.updatedAt ? new Date(t.updatedAt).toLocaleString("en-GB") : "",
      });
    });
  });
  const wb = XLSX.utils.book_new();
  const wsEvents = XLSX.utils.json_to_sheet(eventRows);
  wsEvents["!cols"] = [ {wch:28},{wch:20},{wch:9},{wch:16},{wch:22},{wch:16},{wch:16},{wch:10},{wch:9},{wch:10},{wch:26},{wch:20},{wch:34} ];
  const wsTasks = XLSX.utils.json_to_sheet(taskRows);
  wsTasks["!cols"] = [ {wch:28},{wch:16},{wch:32},{wch:14},{wch:26},{wch:34},{wch:18} ];
  XLSX.utils.book_append_sheet(wb, wsEvents, "Events");
  XLSX.utils.book_append_sheet(wb, wsTasks, "Tasks");
  return wb;
}
async function exportToExcel(){
  if(typeof XLSX === "undefined"){
    showToast("Excel export didn't load — check your connection and try again.");
    return;
  }
  const btn = document.getElementById("exportExcelBtn");
  if(btn){ btn.disabled = true; btn.textContent = "⬇️ Preparing…"; }
  try{
    const wb = buildExportWorkbook();
    const arrayBuf = XLSX.write(wb, {type:"array", bookType:"xlsx"});
    const blob = new Blob([arrayBuf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const filename = `TCA-Marketing-Calendar-${isoDate(startOfToday())}.xlsx`;

    // Inside the Claude artifact viewer, a page can't trigger a browser
    // download directly — it has to hand the file to the viewer via the
    // "downloads" capability, which shows them a confirmation first.
    let handled = false;
    try{
      const downloads = window.claude?.use ? await window.claude.use("downloads") : null;
      if(downloads){
        const res = await downloads.save({ filename, data: blob });
        showToast(res.status === "saved" ? "Excel file saved." : "Excel file sent.");
        handled = true;
      }
    }catch(err){
      if(err && err.code === "declined"){ handled = true; } // user said no — not an error
      else console.warn("downloads.save failed", err);
    }

    // Standalone/self-hosted package (no window.claude at all): a normal
    // browser download works fine there, so fall back to it.
    if(!handled){
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      showToast("Excel file downloaded.");
    }
  }catch(e){
    console.error("Excel export failed", e);
    showToast("Couldn't generate the Excel file — please try again.");
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = "⬇️ Export to Excel"; }
  }
}

/* =====================================================================
   INIT
   ===================================================================== */
function init(){
  const today = startOfToday();
  calYear = today.getFullYear();
  calMonth = today.getMonth();

  loadCurrentUser();
  document.getElementById("teamMemberOptions").innerHTML = TEAM_MEMBERS.map(m=>`<option value="${m}">`).join("");
  const roleSelect = document.getElementById("roleSelect");
  roleSelect.innerHTML = TEAM_MEMBERS.map(m=>`<option value="${m}">${ADMIN_ROLES.includes(m)?"👑 ":""}${m}</option>`).join("");
  roleSelect.value = currentUser;
  roleSelect.addEventListener("change", (e)=> setCurrentUser(e.target.value));

  loadLocalTemplates(); // instant local cache of any admin add/edit/delete; "db" (if available) then takes over
  loadLocalState(); // instant local cache; the "db" capability (if available) then takes over as source of truth
  buildFilterBar();
  buildNav();
  renderAll();

  document.getElementById("searchInput").addEventListener("input", (e)=>{
    filters.search = e.target.value.trim();
    renderAll();
  });
  document.getElementById("exportExcelBtn").addEventListener("click", exportToExcel);
  document.getElementById("drawerOverlay").addEventListener("click", closeDrawer);
  document.getElementById("templateModalOverlay").addEventListener("click", (e)=>{
    if(e.target.id==="templateModalOverlay") closeTemplateModal();
  });
  document.getElementById("mobileMenuBtn").addEventListener("click", ()=>{
    document.querySelector(".sidenav")?.scrollIntoView();
  });
  document.addEventListener("keydown",(e)=>{ if(e.key==="Escape"){ closeDrawer(); closeTemplateModal(); } });

  // No manual "new year" reset needed: if this tab is left open across
  // midnight (or a laptop sleeps overnight), re-check "today" and re-render
  // so the rolling window, prep reminders and Action Required list catch up.
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) renderAll(); });
  setInterval(renderAll, 30*60*1000);

  initDb();
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
