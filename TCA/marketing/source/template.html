/* =====================================================================
   VIEW: TASKS
   ===================================================================== */
function renderTasks(){
  const el = document.getElementById("view-tasks");
  const list = sortedByDate(EVENTS.filter(e=> passesFilter(e) && !isDoneStatus(eventState[e.id].status) && daysUntil(e) >= -60));

  // auto-expand anything needing action, first time only
  if(expandedTasks.size===0){
    list.filter(isActionRequired).forEach(e=>expandedTasks.add(e.id));
  }

  el.innerHTML = `
    <div class="section-head"><h2>Open Tasks <span class="count-pill">${list.length}</span></h2><span class="section-sub">Assign each task to a team member — status &amp; progress update automatically</span></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-ghost btn-sm" id="expandAllTasks">Expand all</button>
      <button class="btn btn-ghost btn-sm" id="collapseAllTasks">Collapse all</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      ${list.length ? list.map(ev=>{
        const st = eventState[ev.id];
        const open = expandedTasks.has(ev.id);
        const urgent = isActionRequired(ev);
        return `<div class="task-row ${urgent?'urgent':''}" style="${urgent?'border-left:4px solid var(--red);':''}">
          <div class="task-row-head" data-toggle="${ev.id}" style="cursor:pointer;">
            <div class="task-row-title">${CATEGORIES[ev.category].emoji} ${ev.name} <span class="section-sub tabular">— ${fmtDateShort(ev._date)} · ${countdownLabel(ev)}</span></div>
            <div style="display:flex;align-items:center;gap:10px;">
              ${statusPill(st.status)}
              <span class="task-frac">${tasksDone(ev.id)}/${tasksTotal(ev.id)} · ${pctDone(ev.id)}%</span>
              <button class="icon-btn" style="display:flex;width:40px;height:40px;" data-open="${ev.id}" title="Open full details">${ICONS.chevronR}</button>
            </div>
          </div>
          <div class="mini-progress"><span style="width:${pctDone(ev.id)}%"></span></div>
          ${open ? `<div style="display:flex;flex-direction:column;gap:4px;">
            ${ev.tasks.map((t,i)=>taskLineHTML(ev.id, i)).join("")}
          </div>` : ""}
        </div>`;
      }).join("") : `<div class="empty-state"><span class="emoji">🎉</span>No open tasks match the current filters.</div>`}
    </div>`;
  attachCardOpeners(el);
  wireTaskLineEvents(el);
  el.querySelectorAll("[data-toggle]").forEach(row=>{
    row.addEventListener("click", ()=>{
      const id = row.dataset.toggle;
      if(expandedTasks.has(id)) expandedTasks.delete(id); else expandedTasks.add(id);
      renderTasks();
    });
  });
  document.getElementById("expandAllTasks").addEventListener("click", ()=>{ list.forEach(e=>expandedTasks.add(e.id)); renderTasks(); });
  document.getElementById("collapseAllTasks").addEventListener("click", ()=>{ expandedTasks.clear(); renderTasks(); });
}

/* =====================================================================

function openDrawer(id){

  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawerOverlay").classList.add("open");
}
function closeDrawer(){
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("drawerOverlay").classList.remove("open");
  openDrawerId = null;
}
function renderDrawer(){
  if(!openDrawerId) return;
  const ev = EVENT_BY_ID[openDrawerId];

  drawer.innerHTML = `
    <div class="drawer-head">
      <button class="drawer-close" id="drawerCloseBtn">${ICONS.close}</button>
      ${catBadge(ev)}
      <h2>${ev.name}</h2>
      <div class="dh-meta">
        <div>Date<b>${fmtDate(ev._date)}</b></div>
        <div>Countdown<b>${countdownLabel(ev)}</b></div>
        <div>Prep deadline<b>${fmtDateShort(prepDate(ev))}</b></div>
        <div>Priority<b>${ev.priority[0].toUpperCase()+ev.priority.slice(1)}</b></div>
        <div>Recurrence<b>${ev._recurring===false?'📌 One-off':'🔁'} ${recurrenceLabel(ev.recurrence)}</b></div>

      ${isAdmin() ? `
      <div class="drawer-section" style="display:flex;gap:10px;padding-top:0;">
        <button class="btn btn-ghost btn-sm" id="editEventBtn">✏️ Edit event</button>
        <button class="link-btn" id="deleteEventBtn" style="color:var(--red);">🗑️ Delete event</button>
      </div>` : ""}
      <div class="drawer-section">
        <label class="field-label">Description &amp; purpose</label>

      <div class="drawer-section">
        <label class="field-label">Marketing requirements</label>

      </div>
      <div class="drawer-section">
        <label class="field-label">Project status</label>
        <div class="status-grid">
          ${STATUSES.map(s=>`<button class="status-btn ${st.status===s.key?'active':''}" style="--st-color:${s.color}" data-status="${s.key}"><span class="sdot"></span>${s.key}</button>`).join("")}
        </div>
      </div>
      <div class="drawer-section">
        <div class="progress-summary"><label class="field-label" style="margin:0;">Task tracker</label><b class="tabular">${tasksDone(ev.id)} / ${tasksTotal(ev.id)} — ${pctDone(ev.id)}%</b></div>
        <div class="big-progress"><span style="width:${pctDone(ev.id)}%"></span></div>

      </div>
      <div class="drawer-section">
        <label class="field-label" for="assigneeInput">Campaign lead</label>
        <input class="field-input" list="assigneeOptions" id="assigneeInput" value="${st.assignedTo}">
        <datalist id="assigneeOptions">${ASSIGNEE_OPTIONS.map(a=>`<option value="${a}">`).join("")}</datalist>
      </div>
      <div class="drawer-section">
        <label class="field-label" for="notesInput">Notes</label>

      </div>

  `;

  document.getElementById("notesInput").addEventListener("blur", (e)=> setNotes(ev.id, e.target.value));
  document.getElementById("editEventBtn")?.addEventListener("click", ()=> openTemplateModal(ev._templateId || ev.id));
  document.getElementById("deleteEventBtn")?.addEventListener("click", ()=>{
    const templateId = ev._templateId || ev.id;

/* =====================================================================
   VIEW: MY TASKS (team member's own queue, or the admin's team-wide board)
   ===================================================================== */
function renderMyTasks(){
  const el = document.getElementById("view-mytasks");
  const all = allTasksFlat();

  if(!isAdmin()){
    const mine = all.filter(x=> x.t.assignedTo===currentUser).sort((a,b)=>a.ev._date-b.ev._date);
    el.innerHTML = `
      <div class="section-head"><h2>🙋 My Tasks <span class="count-pill">${mine.length}</span></h2><span class="section-sub">Everything currently assigned to ${currentUser}</span></div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        ${mine.length ? mine.map(({ev,idx})=>`
          <div class="task-row">
            <div class="task-row-head" style="cursor:default;">
              <div class="task-row-title">${CATEGORIES[ev.category].emoji} ${ev.name} <span class="section-sub tabular">— ${fmtDate(ev._date)} · ${countdownLabel(ev)}</span></div>
              <div style="display:flex;align-items:center;gap:10px;">
                ${priorityFlag(ev)}
                <button class="icon-btn" style="display:flex;width:40px;height:40px;" data-open="${ev.id}" title="Open full event details">${ICONS.chevronR}</button>
              </div>
            </div>
            ${taskLineHTML(ev.id, idx)}
          </div>`).join("")
        : `<div class="empty-state"><span class="emoji">🎉</span>Nothing assigned to you right now — check back after your admin assigns new tasks.</div>`}
      </div>`;
  } else {
    // "Open" mirrors the Tasks view's own window (not done, not ancient) so
    // this board doesn't dump hundreds of far-future tasks at once.
    const openOnly = all.filter(x=> x.t.status!=="Completed" && !isDoneStatus(eventState[x.ev.id].status) && daysUntil(x.ev) >= -60);
    const unassignedAll = openOnly.filter(x=> !x.t.assignedTo);
    const unassignedUrgent = unassignedAll.filter(x=> isActionRequired(x.ev)).sort((a,b)=>a.ev._date-b.ev._date).slice(0,20);
    const byPerson = {};
    openOnly.forEach(x=>{ if(x.t.assignedTo){ (byPerson[x.t.assignedTo] = byPerson[x.t.assignedTo] || []).push(x); } });
    const people = Object.keys(byPerson).sort();

    el.innerHTML = `
      <div class="section-head"><h2>🗂️ Team Task Board</h2><span class="section-sub">Assigned work by team member, plus the nearest-deadline unassigned tasks</span></div>
      ${unassignedAll.length ? `
      <div class="drawer-section" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;margin-top:12px;">
        <label class="field-label">⚠️ Unassigned open tasks — ${unassignedAll.length} in total</label>
        ${unassignedUrgent.length ? `
        <div style="display:flex;flex-direction:column;gap:4px;margin-top:8px;">
          ${unassignedUrgent.map(({ev,idx})=>taskLineHTML(ev.id, idx)).join("")}
        </div>` : `<p class="section-sub" style="margin-top:6px;">None are urgent yet — open the <b>Tasks</b> view to get ahead and assign them early.</p>`}
        ${unassignedAll.length > unassignedUrgent.length ? `<p class="section-sub" style="margin-top:8px;">+ ${unassignedAll.length - unassignedUrgent.length} more not yet in their prep window — assign these from the <b>Tasks</b> view.</p>` : ""}
      </div>` : ""}
      ${people.length ? people.map(person=>`
        <div style="margin-top:20px;">
          <div class="section-head"><h2 style="font-size:1rem;">👤 ${person} <span class="count-pill">${byPerson[person].length}</span></h2></div>
          <div style="display:flex;flex-direction:column;gap:4px;margin-top:8px;">
            ${byPerson[person].sort((a,b)=>a.ev._date-b.ev._date).map(({ev,idx})=>taskLineHTML(ev.id, idx)).join("")}
          </div>
        </div>`).join("") : ""}
      ${!people.length && !unassignedAll.length ? `<div class="empty-state" style="margin-top:12px;"><span class="emoji">🎉</span>No open tasks right now — everything's assigned and complete.</div>` : ""}
    `;
  }
  attachCardOpeners(el);
  wireTaskLineEvents(el);
}

/* =====================================================================
   MASTER RENDER
   ===================================================================== */
function renderAll(){
  rebuildEvents(); // cheap; keeps "today" and the rolling 12-month window always current
  buildNav();
  document.querySelectorAll(".view").forEach(v=> v.classList.toggle("active", v.dataset.view===currentView));
  if(currentView==="dashboard") renderDashboard();
  else if(currentView==="calendar") renderCalendar();
  else if(currentView==="upcoming") renderUpcoming();
  else if(currentView==="tasks") renderTasks();
  else if(currentView==="mytasks") renderMyTasks();
  else if(currentView==="campaigns") renderCampaigns();
  else if(currentView==="completed") renderCompleted();
  if(openDrawerId) renderDrawer();
}

/* =====================================================================
   INIT
   ===================================================================== */
function init(){
  const today = startOfToday();
  calYear = today.getFullYear();
  calMonth = today.getMonth();

  loadCurrentUser();
  document.getElementById("teamMemberOptions").innerHTML = TEAM_MEMBERS.map(m=>`<option value="${m}">`).join("");
  const roleSelect = document.getElementById("roleSelect");
  roleSelect.innerHTML = TEAM_MEMBERS.map(m=>`<option value="${m}">${ADMIN_ROLES.includes(m)?"👑 ":""}${m}</option>`).join("");
  roleSelect.value = currentUser;
  roleSelect.addEventListener("change", (e)=> setCurrentUser(e.target.value));

  loadLocalTemplates(); // instant local cache of any admin add/edit/delete; "db" (if available) then takes over
  loadLocalState(); // instant local cache; the "db" capability (if available) then takes over as source of truth
  buildFilterBar();
  buildNav();
  renderAll();

  document.getElementById("searchInput").addEventListener("input", (e)=>{
    filters.search = e.target.value.trim();
    renderAll();
  });
  document.getElementById("drawerOverlay").addEventListener("click", closeDrawer);
  document.getElementById("templateModalOverlay").addEventListener("click", (e)=>{
    if(e.target.id==="templateModalOverlay") closeTemplateModal();
  });
  document.getElementById("mobileMenuBtn").addEventListener("click", ()=>{
    document.querySelector(".sidenav")?.scrollIntoView();
  });
  document.addEventListener("keydown",(e)=>{ if(e.key==="Escape"){ closeDrawer(); closeTemplateModal(); } });

  // No manual "new year" reset needed: if this tab is left open across
  // midnight (or a laptop sleeps overnight), re-check "today" and re-render
  // so the rolling window, prep reminders and Action Required list catch up.
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) renderAll(); });
  setInterval(renderAll, 30*60*1000);

  initDb();
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
