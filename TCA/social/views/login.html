<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Confidence Academy — Admin access</title>
<meta name="theme-color" content="#00247D">
<meta name="robots" content="noindex, nofollow">
<link rel="shortcut icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#00247D; --blue-dark:#001A5C;
    --red:#CF142B;  --red-dark:#8C0E1E;
    --gold:#FFB81C; --gold-dark:#8A5C00;
    --sky:#4A90D9;  --sky-dark:#1D4E89; --sky-tint:#DCE9F8;
    --ink:#0B1C39;  --charcoal:#4A5568;
    --cloud:#F4F6FB; --white:#FFFFFF;
    --grad:linear-gradient(115deg,var(--blue) 0%,var(--red) 100%);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cloud);color:var(--ink);
    font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.5}


  /* ---------------- admin gate ---------------- */
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 24px}
  .gate[hidden]{display:none}
  .gate-bars{position:fixed;left:0;top:0;bottom:0;width:14px;display:flex;flex-direction:column;z-index:1}
  .gate-bars i{flex:1;display:block}
  .gate-bars i:nth-child(1){background:var(--blue)}
  .gate-bars i:nth-child(2){background:var(--red)}
  .gate-bars i:nth-child(3){background:var(--gold)}
  .gate-bars i:nth-child(4){background:var(--sky)}
  .gate-bars i:nth-child(5){background:var(--ink)}
  .gate-card{width:100%;max-width:432px;background:#fff;border-radius:18px;overflow:hidden;
    box-shadow:0 20px 54px rgba(11,28,57,.15);position:relative;z-index:2}
  .gate-rule{display:flex;height:6px}
  .gate-rule i{flex:1;display:block}
  .gate-rule i:nth-child(1){background:var(--blue)}
  .gate-rule i:nth-child(2){background:var(--red)}
  .gate-rule i:nth-child(3){background:var(--gold)}
  .gate-rule i:nth-child(4){background:var(--sky)}
  .gate-rule i:nth-child(5){background:var(--ink)}
  .gate-body{padding:42px 40px 36px}
  .gate-logo{width:198px;display:block;margin-bottom:30px}
  .gate-body h1{font-family:Sora,sans-serif;font-weight:700;font-size:25px;letter-spacing:-.02em;
    margin:0 0 7px;color:var(--ink)}
  .gate-sub{margin:0 0 6px;font-size:14.5px;color:var(--charcoal)}
  .gate-body label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:20px 0 7px}
  .gate-body input{width:100%;font-family:Inter,sans-serif;font-size:15.5px;color:var(--ink);
    padding:13px 15px;border:1.5px solid rgba(11,28,57,.18);border-radius:10px;background:var(--cloud)}
  .gate-body input:focus{outline:none;background:#fff;border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(74,144,217,.4)}
  .gate-body input.bad{border-color:var(--red);background:#FDF4F5}
  .pw{position:relative}
  .pw input{padding-right:78px}
  .reveal{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;
    font-family:Inter,sans-serif;font-size:12.5px;font-weight:600;color:var(--sky-dark);
    cursor:pointer;padding:9px 11px;border-radius:8px}
  .reveal:hover{background:var(--sky-tint)}
  .reveal:focus-visible{outline:3px solid var(--sky);outline-offset:1px}
  .gate-error{display:flex;gap:9px;align-items:flex-start;margin:18px 0 0;padding:11px 13px;
    background:#FDECEE;border-left:4px solid var(--red);border-radius:8px;
    font-size:13.5px;font-weight:500;color:var(--red-dark)}
  .gate-error[hidden]{display:none}
  .gate-error svg{width:16px;height:16px;flex:0 0 auto;margin-top:1px}
  .gate-go{width:100%;height:52px;margin-top:24px;border:0;border-radius:12px;cursor:pointer;
    background:var(--red);color:#fff;font-family:Inter,sans-serif;font-size:16px;font-weight:600}
  .gate-go:hover{background:#B31226}
  .gate-go:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
  .gate-go[disabled]{opacity:.45;cursor:not-allowed}
  .gate-note{margin:26px 0 0;padding-top:18px;border-top:1px solid rgba(11,28,57,.1);
    font-size:12px;line-height:1.55;color:var(--charcoal)}

</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <main class="gate-card">
    <div class="gate-rule" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="gate-body">
      <img class="gate-logo" src="https://suvrasispal.github.io/TCA/brand/logo-primary.svg"
           alt="The Confidence Academy — Get Britain Moving">
      <h1>Admin access</h1>
      <p class="gate-sub">Sign in to open the social post templates.</p>

      <form id="gate-form" novalidate autocomplete="on">
        <label for="gate-user">Username</label>
        <input id="gate-user" name="username" type="text" autocomplete="username"
               autocapitalize="off" autocorrect="off" spellcheck="false" required>

        <label for="gate-pass">Password</label>
        <div class="pw">
          <input id="gate-pass" name="password" type="password"
                 autocomplete="current-password" required>
          <button type="button" class="reveal" id="gate-reveal"
                  aria-label="Show password" aria-pressed="false">Show</button>
        </div>

        <p class="gate-error" id="gate-error" role="alert" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.3v.2"/></svg>
          <span id="gate-error-text"></span>
        </p>

        <button type="submit" class="gate-go" id="gate-go">Log in</button>
      </form>

      <p class="gate-note">Credentials are verified on the server. This page holds no
      username, password or hash — it only sends what you type and is told yes or no.</p>
    </div>
  </main>
</div>
<script>
(function () {
  "use strict";
  // No credentials, no hashes, no comparison logic here. This posts what the
  // user typed to the server and reacts to a yes/no. Everything that decides
  // the answer lives in tca_server.py and .env, neither of which is served.
  var form = document.getElementById("gate-form");
  var uEl = document.getElementById("gate-user");
  var pEl = document.getElementById("gate-pass");
  var goEl = document.getElementById("gate-go");
  var errEl = document.getElementById("gate-error");
  var errTxt = document.getElementById("gate-error-text");
  var revealEl = document.getElementById("gate-reveal");
  var busy = false;

  function showError(msg) { errTxt.textContent = msg; errEl.hidden = false; }
  function clearError() {
    errEl.hidden = true;
    uEl.classList.remove("bad"); pEl.classList.remove("bad");
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    if (busy) return;
    clearError();

    var u = uEl.value.trim(), pw = pEl.value;
    if (!u || !pw) {
      if (!u) uEl.classList.add("bad");
      if (!pw) pEl.classList.add("bad");
      showError("Enter both a username and a password.");
      (!u ? uEl : pEl).focus();
      return;
    }

    busy = true;
    goEl.disabled = true;
    goEl.textContent = "Checking\u2026";
    try {
      var res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ username: u, password: pw })
      });
      var data = await res.json().catch(function () { return {}; });

      if (res.ok && data.ok) { window.location.replace(data.next || "/app"); return; }

      uEl.classList.add("bad"); pEl.classList.add("bad");
      pEl.value = "";
      showError(data.error || "Those credentials weren't recognised.");
      if (res.status === 429) { goEl.textContent = "Log in"; goEl.disabled = true; return; }
      pEl.focus();
    } catch (err) {
      showError("Couldn't reach the server. Check it's still running and try again.");
    } finally {
      if (!goEl.disabled) goEl.textContent = "Log in";
      busy = false;
      if (goEl.textContent === "Checking\u2026") goEl.textContent = "Log in";
      goEl.disabled = goEl.disabled && errTxt.textContent.indexOf("Too many") === 0;
    }
  });

  [uEl, pEl].forEach(function (el) {
    el.addEventListener("input", function () { if (!errEl.hidden) clearError(); });
  });

  revealEl.addEventListener("click", function () {
    var shown = pEl.type === "text";
    pEl.type = shown ? "password" : "text";
    revealEl.textContent = shown ? "Show" : "Hide";
    revealEl.setAttribute("aria-label", shown ? "Show password" : "Hide password");
    revealEl.setAttribute("aria-pressed", String(!shown));
    pEl.focus();
  });

  uEl.focus();
})();
</script>
</body>
</html>
