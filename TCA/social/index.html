<style>
  :root{
    --blue:#00247D; --blue-dark:#001A5C;
    --red:#CF142B;  --red-dark:#8C0E1E;
    --gold:#FFB81C; --gold-dark:#8A5C00;
    --sky:#4A90D9;  --sky-dark:#1D4E89; --sky-tint:#DCE9F8;
    --ink:#0B1C39;  --charcoal:#4A5568;
    --cloud:#F4F6FB; --white:#FFFFFF;
    --grad:linear-gradient(115deg,var(--blue) 0%,var(--red) 100%);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cloud);color:var(--ink);
    font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.5}

  /* ---------------- admin gate ---------------- */
  .gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:48px 24px}
  .gate[hidden]{display:none}
  .gate-bars{position:fixed;left:0;top:0;bottom:0;width:14px;display:flex;flex-direction:column;z-index:1}
  .gate-bars i{flex:1;display:block}
  .gate-bars i:nth-child(1){background:var(--blue)}
  .gate-bars i:nth-child(2){background:var(--red)}
  .gate-bars i:nth-child(3){background:var(--gold)}
  .gate-bars i:nth-child(4){background:var(--sky)}
  .gate-bars i:nth-child(5){background:var(--ink)}
  .gate-card{width:100%;max-width:432px;background:#fff;border-radius:18px;overflow:hidden;
    box-shadow:0 20px 54px rgba(11,28,57,.15);position:relative;z-index:2}
  .gate-rule{display:flex;height:6px}
  .gate-rule i{flex:1;display:block}
  .gate-rule i:nth-child(1){background:var(--blue)}
  .gate-rule i:nth-child(2){background:var(--red)}

  <footer>
    <h3>PSD downloads</h3>
    <p>The <b>Layered PSD</b> button under each template links to its file in the <span style="font-family:'Space Mono',monospace">assets/</span> folder, so keep that folder next to <span style="font-family:'Space Mono',monospace">index.html</span> when you deploy. Each opens at full export size with the same layer stack: <b>Background</b>, <b>PHOTO — replace</b>, <b>Scrim</b> or <b>Panel</b>, <b>Logo card</b>, a <b>Copy</b> group holding the badge, headline, supporting line and CTA, and a hidden <b>Guides</b> group with the safe margins. Every layer is named with its type token, so the spec travels with the file.</p>

    <h3>Access, sessions and what this gate is worth</h3>
    <p>The page opens on an admin sign-in. Until the correct credentials go in, the templates
    markup sits in an inert <span style="font-family:'Space Mono',monospace">&lt;template&gt;</span>
    element, so it isn't in the document, none of its images or video elements load, and none of
    its scripts run. Opening the file's URL directly, refreshing, or using back and forward all
    land on the sign-in first. A successful login stores a session token for the tab, so a refresh
    keeps you in; <b>Log out</b> in the toolbar clears it and returns you to the sign-in.</p>
    <p><b>Be clear about what this is.</b> It's a static HTML file, so the check runs in the
    browser. Credentials are stored as salted SHA-256 digests rather than plain text, which keeps
    them out of View Source, and five wrong attempts trigger a short lockout — but anyone who
    reads the page source can work around the gate entirely. This is the right shape of lock for
    an internal tool and the wrong one for anything confidential. If these templates ever need
    real protection, put the file behind a server that checks credentials before it sends the
    page. To change the credentials, run
    <span style="font-family:'Space Mono',monospace">python3 tca_assets.py hash &lt;user&gt; &lt;pass&gt;</span>
    and paste the two digests over the AUTH constants.</p>

    <h3>Favicons</h3>
    <p>Generated from your <span style="font-family:'Space Mono',monospace">favicon.ico</span> by
    <span style="font-family:'Space Mono',monospace">tca_assets.py icons</span>: a multi-size
    .ico plus 16, 32, 48, 192 and 512px PNGs and a 180px Apple touch icon flattened onto brand
    navy, since iOS renders transparency as black. The head also carries a 32px inline copy as a
    data URI, so the icon still appears when the file is opened on its own with no sibling assets
    next to it. Both the sign-in and the templates use the same set.</p>

    <h3>Replicating content across the five templates</h3>
    <p>Every template carries a <b>Replicate to all</b> button. It reads the current template's headline, supporting line, CTA, pillar badge label, any stat, and the uploaded media, then writes them into the other four. What it deliberately does not carry across is layout: each destination keeps its own frame, margins, type sizes, scrim geometry, badge colour and pillar icon.</p>
    <ul>
      <li><b>Headlines are re-broken, not copied.</b> The text is taken as one plain string and re-measured against each platform's own font size and column width — 46px over 900px on Facebook, 68px over 1040px on YouTube, 42px over 500px on LinkedIn, and so on. Line breaks are then balanced so no platform ends on a one-word widow. A three-line break you typed for TikTok will not turn into a broken two-line Facebook headline.</li>
      <li><b>The badge label travels, the pillar styling doesn't.</b> Each template keeps its own badge colour and icon, because those encode the pillar the format was designed around.</li>
      <li><b>Stats are only written where they exist</b> — Instagram's single figure and LinkedIn's pair. Replicating from a template that has no stat leaves those figures untouched rather than blanking them.</li>
      <li><b>Media adapts to what each format can hold.</b> A still goes to all five. A video goes to the two video-capable templates, and the still formats receive a frame grabbed from it, so nothing is left with an empty background.</li>
      <li><b>Nothing downloads automatically.</b> Replication only updates the previews. Each template flashes to show it changed, the banner lists what was updated and warns if a headline now runs long anywhere, and you export each one when you're happy with it.</li>
    </ul>

    <h3>Video on the TikTok and YouTube templates</h3>
    <p>Upload a clip and it becomes the background layer, cover-fitted to the frame exactly as a still would be. The brand layer — scrim, logo card, pillar badge, headline, supporting line and CTA — is rendered once to an off-screen canvas and composited over every frame, so the type stays sharp and matches the JPG pixel for pixel rather than being scaled with the footage. Nothing about the layout shifts to accommodate the media.</p>
    <ul>
      <li><b>Recording runs in real time.</b> A 20-second clip takes 20 seconds to export, and the button turns into <b>Stop recording</b> if you want to finish early. Exports are capped at 60 seconds.</li>
      <li><b>Format follows the browser.</b> MP4 where it's supported (Safari, recent Chrome), WebM otherwise. Both platforms' uploaders are happiest with MP4 — if you end up with a WebM, run it through any converter before posting.</li>
      <li><b>Audio from the clip is included</b> where the browser allows it, and stays silent on your speakers while recording.</li>
      <li><b>Preview loops muted</b> so you can edit copy against moving footage. The export plays the clip through once from the start.</li>
      <li><b>Cover JPG</b> grabs the frame currently showing, with the overlay burned in — useful for the post thumbnail.</li>
      <li>This is a browser recording, not a re-encode of your original file, so treat the output as a social-ready master rather than an archival one. For broadcast-grade output, take the PSD overlay into an editor instead.</li>
    </ul>

    <h3>What the browser export does and doesn't do</h3>
    <ul>
      <li>Stills render at true export size — 1200 × 630, 1080 × 1350, 1200 × 627, 1080 × 1920, 1920 × 1080 — not at the reduced size shown on screen. It redraws from your live text and image rather than screenshotting the page.</li>
      <li>Guides, keep-out zones and placeholder chips are never included in the export, whether or not they're switched on.</li>
      <li>Text you type is measured and wrapped in the export the same way the browser wraps it on screen, so a longer headline breaks in the same place. Very long headlines will still overrun the scrim — that's a copy decision, not a bug, and the two-line rule in the book exists for this reason.</li>
      <li>The logo and stock photos load from other domains. If your browser refuses to export because of that, the JPG button will say so and you can load either from disk with <b>Replace logo</b> or <b>Replace photo</b>.</li>
    </ul>

    <h3>One limitation in the PSDs, stated plainly</h3>
    <p>Text in the PSD files is rasterized on named layers, not live Photoshop type — the format's type engine can't be written from outside Photoshop. Layers move, recolour and mask normally, but to change wording either re-set the line with the Type tool using the token in the layer name (Sora 700, Inter 400/600, Space Mono 700, all free on Google Fonts), or just edit and export here.</p>

    <h3>Before publishing</h3>
    <p>Replace the stock photography with commissioned images of real members, rewrite the dummy copy against the pillar named in each badge, and write alt text for every image — never left blank. If a photo needs tying to the brand, use one flat tint of Royal Blue or Ink at 15–25% across the whole frame, not a duotone.</p>
    <p><b>One deliberate deviation:</b> pillar badges are set at 16–17px rather than the 11–12px web token. At export scale these assets are viewed at a third to a half size in-feed, where 12px stops being legible and the badge fails the pillar it belongs to.</p>

    c.fillStyle = WHITE;
    multiline(root, "h3").forEach(function (l, i) { c.fillText(l, M, 440 + 84 * i + 42); });

    setFont(c, 400, 30, "Inter, sans-serif", 0);
    c.fillStyle = "rgba(255,255,255,0.78)";
    wrap(c, txt(root, ".sub"), 940).forEach(function (l, i) {
      c.fillText(l, M, 640 + 44 * i + 22);
    });

    button(c, M, 772, txt(root, ".cta"), 26, 72, 42, "red");
  };

  // ------------------------------------------------------------- wiring
  var ORIGINAL = {};
  document.querySelectorAll(".canvas").forEach(function (n) { ORIGINAL[n.id] = n.innerHTML; });

  function status(bar, msg, ms) {
    var s = bar.querySelector("[data-status]");
    s.textContent = msg || "";
    if (ms) setTimeout(function () { if (s.textContent === msg) s.textContent = ""; }, ms);
  }

  function save(blob, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 8000);
  }

  // ---- media loading (image or, on TikTok, video) ----
  function loadMedia(file, root, bar, kind) {
    if (!file) return;
    var isVideo = /^video\//.test(file.type);
    var isImage = /^image\//.test(file.type);
    var video = root.querySelector("video");

    if (isVideo && !video) { status(bar, "Video is only supported on the TikTok template.", 5000); return; }
    if (!isVideo && !isImage) { status(bar, "That file isn't an image or a video.", 4000); return; }

    var url = URL.createObjectURL(file);

    if (isVideo) {
      video.hidden = false;
      root.querySelector(".photo").hidden = true;
      video.muted = true;
      video.loop = true;
      video.onloadedmetadata = function () {
        root.dataset.mode = "video";
        setMode(bar, root);
        if (root._applyCrop) root._applyCrop();
        var d = Math.min(video.duration || 0, MAX_RECORD);
        status(bar, "Video loaded — " + (video.videoWidth || "?") + " × " + (video.videoHeight || "?") +
                    ", " + d.toFixed(1) + "s" +
                    (video.duration > MAX_RECORD ? " (export capped at " + MAX_RECORD + "s)" : ""), 7000);
        video.play().catch(function () {});
      };
      video.onerror = function () { status(bar, "Couldn't decode that video — try an MP4 or WebM.", 6000); };
      video.src = url;
    } else {
      var img = root.querySelector(".photo");
      if (video) { video.hidden = true; video.pause(); video.removeAttribute("src"); video.load(); }
      img.hidden = false;
      img.removeAttribute("crossorigin");
      img.onload = function () {
        root.dataset.mode = "image";
        setMode(bar, root);
        if (root._applyCrop) root._applyCrop();
        status(bar, (kind || "Photo") + " replaced.", 2500);
      };
      img.onerror = function () { status(bar, "Couldn't read that file.", 4000); };
      img.src = url;
    }
  }

  function applyCrop(root, slider) {
    root.dataset.focus = slider.value / 100;
    var el = activeMedia(root);
    if (!el) return;
    var axis = slackAxis(el, +root.dataset.w, +root.dataset.h);
    el.style.objectPosition = axis === "x"
      ? slider.value + "% 50%" : "50% " + slider.value + "%";
    var lab = slider.closest(".crop");
    if (lab) lab.firstChild.nodeValue = axis === "x" ? "Crop focus \u2194 " : "Crop focus \u2195 ";
  }

  function setMode(bar, root) {
    var isVideo = root.dataset.mode === "video";
    bar.classList.toggle("is-video", isVideo);
    var label = bar.querySelector("[data-label]");
    if (label) label.textContent = isVideo ? "Download video" : "Download JPG";
  }

  // ---- still export ----
  async function exportStill(id, bar) {
    var root = document.getElementById(id);
    var W = +root.dataset.w, H = +root.dataset.h;
    status(bar, "Rendering…");
    try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}

    var cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    var c = cv.getContext("2d");
    c.fillStyle = "#FFFFFF"; c.fillRect(0, 0, W, H);
    c.textAlign = "left";
    MEDIA[id](c, root);
    OVERLAY[id](c, root);

    cv.toBlob(function (blob) {
      if (!blob) { status(bar, "Export failed — load the photo and logo from disk and retry.", 9000); return; }
      save(blob, "TCA-" + id + "-" + W + "x" + H + ".jpg");
      status(bar, "Saved " + W + " × " + H + " JPG.", 4000);
    }, "image/jpeg", 0.92);
  }

  // ---- video export ----
  var AC = null, recording = null;

  function pickMime() {
    var want = ['video/mp4;codecs="avc1.42E01E,mp4a.40.2"', "video/mp4",
                "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
    for (var i = 0; i < want.length; i++) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(want[i])) return want[i];
    }
    return "";
  }

  function audioTrackFor(video) {
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === "suspended") AC.resume();
      if (!video._srcNode) video._srcNode = AC.createMediaElementSource(video);
      var dest = AC.createMediaStreamDestination();
      video._srcNode.connect(dest);          // recorded, but not routed to the speakers
      return dest.stream.getAudioTracks()[0] || null;
    } catch (e) { return null; }
  }

  async function exportVideo(id, bar, btn) {
    var root = document.getElementById(id);
    var W = +root.dataset.w, H = +root.dataset.h;
    var video = root.querySelector("video");
    if (!video || !video.src) { status(bar, "Upload a video first.", 4000); return; }

    var mime = pickMime();
    if (!mime) { status(bar, "This browser can't record video. Use Cover JPG instead.", 8000); return; }

    try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}

    // the brand layer is fixed for the whole clip, so render it once
    var ov = document.createElement("canvas");
    ov.width = W; ov.height = H;
    var oc = ov.getContext("2d");
    oc.textAlign = "left";
    OVERLAY[id](oc, root);

    var cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    var c = cv.getContext("2d");
    c.textAlign = "left";

    var stream = cv.captureStream(30);
    var atrack = audioTrackFor(video);
    if (atrack) stream.addTrack(atrack);

    var rec;
    try { rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 }); }
    catch (e) { status(bar, "Recorder wouldn't start: " + e.message, 8000); return; }

    var chunks = [], raf = 0, stopped = false;
    var ext = mime.indexOf("mp4") > -1 ? "mp4" : "webm";
    var limit = Math.min(video.duration || MAX_RECORD, MAX_RECORD);

    rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = function () {
      cancelAnimationFrame(raf);
      recording = null;
      btn.classList.remove("rec");
      btn.querySelector("[data-label]").textContent = "Download video";
      video.pause(); video.muted = true; video.loop = true;
      video.currentTime = 0; video.play().catch(function () {});
      var blob = new Blob(chunks, { type: mime });
      if (!blob.size) { status(bar, "Nothing was recorded.", 6000); return; }
      save(blob, "TCA-tiktok-1080x1920." + ext);
      status(bar, "Saved " + W + " × " + H + " " + ext.toUpperCase() +
                  " (" + (blob.size / 1048576).toFixed(1) + " MB).", 9000);
    };

    function frame() {
      c.fillStyle = "#000000"; c.fillRect(0, 0, W, H);
      MEDIA[id](c, root);
      c.drawImage(ov, 0, 0);
      var t = video.currentTime;
      status(bar, "Recording " + t.toFixed(1) + "s / " + limit.toFixed(1) + "s — click Stop to finish early.");
      if (!stopped && (video.ended || t >= limit)) { stopped = true; rec.stop(); return; }
      raf = requestAnimationFrame(frame);
    }

    video.loop = false;
    video.muted = false;      // needed for the audio graph; nothing is routed to the speakers
    video.currentTime = 0;
    try { await video.play(); }
    catch (e) {
      video.muted = true;
      try { await video.play(); } catch (e2) {
        status(bar, "Couldn't start playback for recording.", 6000); return;
      }
    }

    recording = { rec: rec, stop: function () { if (!stopped) { stopped = true; rec.stop(); } } };
    btn.classList.add("rec");
    btn.querySelector("[data-label]").textContent = "Stop recording";
    rec.start(200);
    frame();
  }


  // ------------------------------------------------ replicate across platforms
  // Copy is carried across as plain text and re-broken to each platform's own
  // measure, so nothing inherits another format's line endings or positioning.
  var NAMES = { fb: "Facebook", ig: "Instagram", li: "LinkedIn", tt: "TikTok", yt: "YouTube" };
  var HEADCFG = {
    fb: { size: 46, w: 900,  max: 2 },
    ig: { size: 50, w: 968,  max: 2 },
    li: { size: 42, w: 500,  max: 3 },
    tt: { size: 62, w: 740,  max: 3 },
    yt: { size: 68, w: 1040, max: 2 }
  };
  var _measure = document.createElement("canvas").getContext("2d");

  function barFor(id) { return document.querySelector('.bar[data-for="' + id + '"]'); }

  function frameToDataURL(video) {
    try {
      var cv = document.createElement("canvas");
      cv.width = video.videoWidth || 1080; cv.height = video.videoHeight || 1920;
      cv.getContext("2d").drawImage(video, 0, 0, cv.width, cv.height);
      return cv.toDataURL("image/jpeg", 0.9);
    } catch (e) { return null; }
  }

  function collect(root) {
    var v = root.querySelector("video");
    var isVid = root.dataset.mode === "video" && v && v.src;
    var img = root.querySelector(".photo");
    return {
      head: multiline(root, "h3").join(" "),
      sub: txt(root, ".sub"),
      cta: txt(root, ".cta"),
      tag: txt(root, ".tag-label"),
      stat: txt(root, ".stat"),
      statlabel: txt(root, ".statlabel"),
      focus: root.dataset.focus || "0.5",
      video: isVid ? v.src : null,
      poster: isVid ? frameToDataURL(v) : null,
      image: isVid ? null : (img ? img.getAttribute("src") : null)
    };
  }

  function setText(root, sel, val) {
    var n = root.querySelector(sel);
    if (n && val) n.textContent = val;
  }

  function setHeadline(root, id, text) {
    var h = root.querySelector("h3");
    if (!h || !text) return 0;
    var cfg = HEADCFG[id];
    setFont(_measure, 700, cfg.size, "Sora, sans-serif", -0.02);
    var lines = balancedWrap(_measure, text, cfg.w);
    h.textContent = "";
    lines.forEach(function (l, i) {
      if (i) h.appendChild(document.createElement("br"));
      h.appendChild(document.createTextNode(l));
    });
    return lines.length > cfg.max ? lines.length : 0;
  }

  function applyTo(id, d) {
    var root = document.getElementById(id), bar = barFor(id);
    var over = setHeadline(root, id, d.head);
    setText(root, ".sub", d.sub);
    setText(root, ".cta", d.cta);
    setText(root, ".tag-label", d.tag);
    if (d.stat) { setText(root, ".stat", d.stat); setText(root, ".statlabel", d.statlabel); }

    var v = root.querySelector("video"), img = root.querySelector(".photo");
    if (d.video && v) {
      img.hidden = true;
      v.hidden = false; v.muted = true; v.loop = true; v.src = d.video;
      v.play().catch(function () {});
      root.dataset.mode = "video";
    } else {
      var src = d.image || d.poster;
      if (v) { v.hidden = true; v.pause(); v.removeAttribute("src"); v.load(); }
      if (img && src) { img.hidden = false; img.removeAttribute("crossorigin"); img.src = src; }
      root.dataset.mode = "image";
    }

    root.dataset.focus = d.focus;
    var crop = bar.querySelector("[data-crop]");
    if (crop) { crop.value = Math.round(parseFloat(d.focus) * 100); }
    if (root._applyCrop) root._applyCrop();
    setMode(bar, root);

    var stage = document.querySelector('[data-drop="' + id + '"]');
    stage.classList.remove("updated");
    void stage.offsetWidth;
    stage.classList.add("updated");
    setTimeout(function () { stage.classList.remove("updated"); }, 2600);
    return over;
  }

  function snapshot() {
    var s = {};
    document.querySelectorAll(".canvas").forEach(function (n) {
      s[n.id] = { html: n.innerHTML, mode: n.dataset.mode, focus: n.dataset.focus };
    });
    return s;
  }

  function restore(snap) {
    Object.keys(snap).forEach(function (id) {
      var root = document.getElementById(id), bar = barFor(id);
      root.innerHTML = snap[id].html;
      if (window.TCA_APPLY_LOGO) window.TCA_APPLY_LOGO(root);
      root.dataset.mode = snap[id].mode || "image";
      root.dataset.focus = snap[id].focus || "0.5";
      var crop = bar.querySelector("[data-crop]");
      if (crop) crop.value = Math.round(parseFloat(root.dataset.focus) * 100);
      if (root._applyCrop) root._applyCrop();
      setMode(bar, root);
      var v = root.querySelector("video");
      if (v && v.src && !v.hidden) v.play().catch(function () {});
    });
  }

  var banner = document.getElementById("banner");
  var lastSnap = null;

  function showBanner(html) {
    banner.querySelector("[data-msg]").innerHTML = html;
    banner.hidden = false;
  }
  banner.querySelector("[data-undo]").addEventListener("click", function () {
    if (lastSnap) restore(lastSnap);
    lastSnap = null;
    banner.hidden = true;
  });
  banner.querySelector("[data-dismiss]").addEventListener("click", function () {
    banner.hidden = true;
  });

  async function replicate(srcId) {
    try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
    lastSnap = snapshot();
    var d = collect(document.getElementById(srcId));
    var done = [], warn = [];
    Object.keys(NAMES).forEach(function (id) {
      if (id === srcId) return;
      var over = applyTo(id, d);
      done.push(NAMES[id]);
      if (over) warn.push(NAMES[id] + " (" + over + " lines)");
    });
    var msg = "<b>Replicated from " + NAMES[srcId] + "</b> to " + done.join(", ") +
              ". Each keeps its own layout, type sizes and crop — review them below before downloading.";
    if (d.video) msg += " The clip carried across to the other video template; " +
                        "the still formats took a frame from it.";
    if (warn.length) msg += ' <span class="warn">Headline runs long on ' + warn.join(", ") +
                            " — tighten the copy or shorten it there.</span>";
    showBanner(msg);
    banner.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  document.querySelectorAll(".bar").forEach(function (bar) {
    var id = bar.dataset.for;
    var root = document.getElementById(id);
    var inPhoto = bar.querySelector('[data-input="photo"]');
    var inLogo = bar.querySelector('[data-input="logo"]');
    var crop = bar.querySelector("[data-crop]");
    if (!root.dataset.mode) root.dataset.mode = "image";
    setMode(bar, root);

    bar.addEventListener("click", function (e) {
      var b = e.target.closest("[data-action]");
      if (!b) return;
      var a = b.dataset.action;
      if (a === "photo") inPhoto.click();
      else if (a === "logo") inLogo.click();
      else if (a === "replicate") {
        replicate(id).catch(function (err) { fail(bar, err); });
      }
      else if (a === "reset") {
        if (recording) recording.stop();
        root.innerHTML = ORIGINAL[id];
        if (window.TCA_APPLY_LOGO) window.TCA_APPLY_LOGO(root);
        root.dataset.mode = "image";
        root.dataset.focus = "0.5";
        if (crop) crop.value = 50;
        setMode(bar, root);
        status(bar, "Reset to the original.", 2500);
      } else if (a === "jpg") {
        exportStill(id, bar).catch(function (err) { fail(bar, err); });
      } else if (a === "export") {
        if (recording) { recording.stop(); return; }
        if (root.dataset.mode === "video") {
          exportVideo(id, bar, b).catch(function (err) { fail(bar, err); });
        } else {
          exportStill(id, bar).catch(function (err) { fail(bar, err); });
        }
      }
    });

    function fail(bar, err) {
      status(bar, "Export blocked: " + (err && err.name === "SecurityError"
        ? "load the logo and photo from disk first." : (err && err.message) || "see the console."), 9000);
      console.error(err);
    }

    inPhoto.addEventListener("change", function () {
      loadMedia(this.files[0], root, bar, "Photo"); this.value = "";
    });
    inLogo.addEventListener("change", function () {
      var f = this.files[0]; this.value = "";
      if (!f || !/^image\//.test(f.type)) { status(bar, "That file isn't an image.", 4000); return; }
      var logo = root.querySelector(".logo");
      logo.removeAttribute("crossorigin");
      logo.onload = function () { status(bar, "Logo replaced.", 2500); };
      logo.src = URL.createObjectURL(f);
    });

    if (crop) {
      crop.addEventListener("input", function () { applyCrop(root, this); });
    }
    root._applyCrop = function () { if (crop) applyCrop(root, crop); };
  });

  // drag and drop media straight onto a template
  document.querySelectorAll("[data-drop]").forEach(function (stage) {
    var id = stage.dataset.drop;
    var bar = document.querySelector('.bar[data-for="' + id + '"]');
    var root = document.getElementById(id);
    ["dragenter", "dragover"].forEach(function (ev) {
      stage.addEventListener(ev, function (e) { e.preventDefault(); stage.classList.add("drag"); });
    });
    ["dragleave", "drop"].forEach(function (ev) {
      stage.addEventListener(ev, function (e) { e.preventDefault(); stage.classList.remove("drag"); });
    });
    stage.addEventListener("drop", function (e) {
      var f = e.dataTransfer && e.dataTransfer.files[0];
      if (f) loadMedia(f, root, bar, "Photo");
    });
  });

  // editable text: plain text only, Enter breaks the line
  function makeEditable(scope) {
    scope.querySelectorAll("[data-edit]").forEach(function (n) {
      n.contentEditable = "true";
      try { n.contentEditable = "plaintext-only"; } catch (e) { }
      n.spellcheck = false;
    });
  }
  makeEditable(document);
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      if (m.addedNodes.length && m.target.classList && m.target.classList.contains("canvas")) {
        makeEditable(m.target);
      }
    });
  }).observe(document.body, { childList: true, subtree: true });

  document.addEventListener("paste", function (e) {
    var el = e.target.closest && e.target.closest("[data-edit]");
    if (!el) return;
    e.preventDefault();
    var t = (e.clipboardData || window.clipboardData).getData("text/plain");
    document.execCommand("insertText", false, t);
  });

  document.getElementById("guides").addEventListener("change", function (e) {
    document.body.classList.toggle("guides", e.target.checked);
  });
  document.getElementById("clean").addEventListener("change", function (e) {
    document.body.classList.toggle("clean", e.target.checked);
  });
};
</script>

<script>
/* =====================================================================
   Admin gate.

   The templates page never exists in the DOM until a correct sign-in:
   its markup sits in an inert <template>, so no images, video elements
   or scripts inside it load or run beforehand. Entering the file's URL
   directly, refreshing, or using back/forward all land here first.

   Credentials are stored as salted SHA-256 digests so they are not
   readable in the page source. That is obfuscation, not security — this
   is a static file, and anyone who reads this script can bypass the gate
   entirely. It is the right shape of lock for an internal tool and the
   wrong one for anything confidential. Real protection means putting the
   file behind a server that checks credentials before sending it.

   To change the credentials:  python3 tca_assets.py hash <user> <pass>
   ===================================================================== */
(function () {
  "use strict";

  var SALT = "tca-social-templates-v1";   // must match SALT in tca_assets.py
  var AUTH = {
    user: "fbcf854f343346cadb1d77a75beee203b1bb3686048402e7b862bcce393e7d56",
    pass: "b17e76e4be517684566b3ca0b4effc06892bc420e96bf537619c8f7ff4eaff51"
  };
  var STORE_KEY = "tca.social.session";
  var MAX_TRIES = 5, LOCK_SECONDS = 10;

  /* --- SHA-256 (public domain, geraintluff/sha256); ASCII input --- */
  function sha256(ascii) {
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    var mp = Math.pow, maxWord = mp(2, 32), i, j, result = "",
        words = [], bitLength = ascii.length * 8,
        hash = sha256.h = sha256.h || [], k = sha256.k = sha256.k || [],
        primeCounter = k.length, isComposite = {};
    for (var candidate = 2; primeCounter < 64; candidate++) {
      if (!isComposite[candidate]) {
        for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
        hash[primeCounter] = (mp(candidate, .5) * maxWord) | 0;
        k[primeCounter++] = (mp(candidate, 1 / 3) * maxWord) | 0;
      }
    }
    ascii += "\x80";
    while (ascii.length % 64 - 56) ascii += "\x00";
    for (i = 0; i < ascii.length; i++) {
      j = ascii.charCodeAt(i);
      if (j >> 8) return null;            // non-ASCII input can't match
      words[i >> 2] |= j << ((3 - i) % 4) * 8;
    }
    words[words.length] = (bitLength / maxWord) | 0;
    words[words.length] = bitLength;
    for (j = 0; j < words.length;) {
      var w = words.slice(j, j += 16), oldHash = hash;
      hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        var t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25))
          + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i]
          + (w[i] = (i < 16) ? w[i] : (w[i - 16]
              + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7]
              + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22))
          + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(t1 + t2) | 0].concat(hash);
        hash[4] = (hash[4] + t1) | 0;
      }
      for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
    }
    for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) {
      var b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? 0 : "") + b.toString(16);
    }
    return result;
  }

  function digest(v) { return sha256(SALT + ":" + v); }

  var TOKEN = digest(AUTH.user + AUTH.pass) || "";

  /* --- session: sessionStorage where available, memory otherwise --- */
  var memory = null;
  function sessionRead() {
    try { return sessionStorage.getItem(STORE_KEY); } catch (e) { return memory; }
  }
  function sessionWrite(v) {
    memory = v;
    try { v === null ? sessionStorage.removeItem(STORE_KEY)
                     : sessionStorage.setItem(STORE_KEY, v); } catch (e) {}
  }

  window.TCA_APPLY_LOGO();          // gate logo, before first paint

  var gate = document.getElementById("gate");
  var host = document.getElementById("app");
  var form = document.getElementById("gate-form");
  var uEl = document.getElementById("gate-user");
  var pEl = document.getElementById("gate-pass");
  var goEl = document.getElementById("gate-go");
  var errEl = document.getElementById("gate-error");
  var errTxt = document.getElementById("gate-error-text");
  var revealEl = document.getElementById("gate-reveal");

  var tries = 0, lockTimer = null;

  function showError(msg) {
    errTxt.textContent = msg;
    errEl.hidden = false;
  }
  function clearError() {
    errEl.hidden = true;
    uEl.classList.remove("bad");
    pEl.classList.remove("bad");
  }

  function lockOut() {
    var left = LOCK_SECONDS;
    goEl.disabled = uEl.disabled = pEl.disabled = true;
    function paint() {
      showError("Too many failed attempts. Try again in " + left + "s.");
    }
    paint();
    lockTimer = setInterval(function () {
      left--;
      if (left <= 0) {
        clearInterval(lockTimer);
        lockTimer = null;
        goEl.disabled = uEl.disabled = pEl.disabled = false;
        tries = 0;
        clearError();
        uEl.focus();
        return;
      }
      paint();
    }, 1000);
  }

  function mount() {
    var tpl = document.getElementById("app-markup");
    host.appendChild(tpl.content.cloneNode(true));
    tpl.remove();
    window.TCA_APPLY_LOGO(host);    // masthead + the five template logo cards
    gate.remove();
    document.title = "The Confidence Academy — Social templates " +
                     "(Facebook, Instagram, LinkedIn, TikTok, YouTube)";
    try { window.TCA_INIT(); }
    catch (e) {
      console.error(e);
      host.insertAdjacentHTML("afterbegin",
        '<p style="padding:24px;color:#8C0E1E">The templates failed to start. ' +
        'See the browser console for details.</p>');
    }
    var out = document.getElementById("logout");
    if (out) out.addEventListener("click", function () {
      sessionWrite(null);
      location.reload();
    });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (lockTimer) return;              // locked out — reject before checking anything
    clearError();

    var u = uEl.value.trim(), pw = pEl.value;
    if (!u || !pw) {
      if (!u) uEl.classList.add("bad");
      if (!pw) pEl.classList.add("bad");
      showError("Enter both a username and a password.");
      (!u ? uEl : pEl).focus();
      return;
    }

    // one message for both fields — don't reveal which half was right
    if (digest(u) === AUTH.user && digest(pw) === AUTH.pass) {
      sessionWrite(TOKEN);
      mount();
      return;
    }

    tries++;
    uEl.classList.add("bad");
    pEl.classList.add("bad");
    pEl.value = "";
    if (tries >= MAX_TRIES) { lockOut(); return; }
    showError("Those credentials weren't recognised. " +
              (MAX_TRIES - tries) + " attempt" + (MAX_TRIES - tries === 1 ? "" : "s") + " left.");
    pEl.focus();
  });

  [uEl, pEl].forEach(function (el) {
    el.addEventListener("input", function () { if (!errEl.hidden && !lockTimer) clearError(); });
  });

  revealEl.addEventListener("click", function () {
    var shown = pEl.type === "text";
    pEl.type = shown ? "password" : "text";
    revealEl.textContent = shown ? "Show" : "Hide";
    revealEl.setAttribute("aria-label", shown ? "Show password" : "Hide password");
    revealEl.setAttribute("aria-pressed", String(!shown));
    pEl.focus();
  });

  // an existing session survives a refresh within the same tab
  if (TOKEN && sessionRead() === TOKEN) mount();
  else uEl.focus();
})();
</script>
</body>
</html>
