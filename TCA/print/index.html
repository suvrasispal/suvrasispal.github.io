<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCA Print Studio — flyer &amp; banner templates</title>
<style>
/* Sora, Inter and Space Mono are injected from TCAFONTS below. */

:root{
  --blue:#00247D; --blue-d:#001A5C; --red:#CF142B; --red-d:#8C0E1E;
  --gold:#FFB81C; --gold-d:#8A5C00; --sky:#4A90D9; --sky-d:#1D4E89;
  --ink:#0B1C39; --char:#4A5568; --cloud:#F4F6FB; --white:#fff;
  --ui-bg:#10182b; --ui-panel:#17203a; --ui-line:#2a3557; --ui-text:#dfe5f5;
  --ui-dim:#8f9dc4; --ui-hot:#7fa8ff;
  --sora:'TCA Sora',system-ui,sans-serif;
  --inter:'TCA Inter',system-ui,sans-serif;
  --mono:'TCA Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--inter); background:var(--ui-bg); color:var(--ui-text);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ui-hot); outline-offset:2px}

/* ---------- top bar ---------- */
.topbar{
  flex:0 0 auto; border-bottom:1px solid var(--ui-line); background:var(--ui-panel);
  display:flex; flex-wrap:wrap; align-items:center; gap:18px; padding:10px 16px;
}
.brandmark{display:flex;align-items:baseline;gap:10px;margin-right:4px}
.brandmark b{font-family:var(--sora);font-weight:800;font-size:15px;letter-spacing:-.01em}
.brandmark span{color:var(--ui-dim);font-size:11.5px}
.guide-toggle{
  display:flex;align-items:center;gap:9px;padding:7px 13px;border-radius:9px;
  background:#0d152b; border:1px solid var(--ui-line); cursor:pointer;
  font-size:13px; user-select:none;
}
.guide-toggle:hover{border-color:#3d4b78}
.guide-toggle input{width:16px;height:16px;accent-color:var(--ui-hot);cursor:pointer;margin:0}
.guide-toggle.on{border-color:var(--ui-hot);background:#152449;color:#fff}
.topbar .spacer{flex:1 1 auto}
.helpbtn{background:none;border:1px solid var(--ui-line);color:var(--ui-dim);
  border-radius:8px;padding:6px 11px;font-size:12.5px;cursor:pointer}
.helpbtn:hover{color:#fff;border-color:#3d4b78}

/* ---------- template tabs ---------- */
.tabs{flex:0 0 auto;display:flex;gap:6px;padding:9px 16px;background:#0c1226;
  border-bottom:1px solid var(--ui-line); overflow-x:auto}
.tabgroup{display:flex;align-items:center;gap:6px;padding-right:12px;margin-right:6px;
  border-right:1px solid var(--ui-line)}
.tabgroup:last-child{border-right:0}
.tabgroup>em{font-style:normal;color:var(--ui-dim);font-size:11.5px;white-space:nowrap;padding-right:2px}
.tab{
  background:#151d33;border:1px solid var(--ui-line);color:var(--ui-text);
  padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;font-size:13px;
  display:flex;align-items:center;gap:8px
}
.tab:hover{border-color:#3d4b78}
.tab[aria-selected=true]{background:#fff;color:#0c1226;border-color:#fff;font-weight:600}
.tab .swatch{width:9px;height:9px;border-radius:2px;background:var(--blue)}
.tab[data-accent=red] .swatch{background:var(--red)}
.tab[data-accent=grad] .swatch{background:linear-gradient(115deg,#00247D,#CF142B)}
.tab[data-accent=gold] .swatch{background:var(--gold)}

/* ---------- layout ---------- */
.work{flex:1 1 auto;display:flex;min-height:0}
.panel{
  flex:0 0 336px; max-width:336px; background:var(--ui-panel); border-right:1px solid var(--ui-line);
  overflow-y:auto; padding:14px 14px 60px;
}
.stagewrap{flex:1 1 auto;position:relative;overflow:auto;background:
  radial-gradient(circle at 30% 0%,#1b2440,#0b1120 70%);}
.stagebar{
  position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 14px;background:rgba(12,18,38,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--ui-line);font-size:12.5px;color:var(--ui-dim)
}
.stagebar .pill{background:#151d33;border:1px solid var(--ui-line);border-radius:99px;padding:3px 10px}
.stage{display:flex;justify-content:center;padding:26px 26px 90px}
.paper{
  position:relative; background:#fff; transform-origin:top center;
  box-shadow:0 24px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
}
.paper svg{display:block}

/* ---------- panel widgets ---------- */
.sec{border:1px solid var(--ui-line);border-radius:11px;margin-bottom:12px;overflow:hidden;background:#131b31}
.sec>summary{
  cursor:pointer;list-style:none;padding:10px 12px;font-weight:600;font-size:13px;
  display:flex;align-items:center;justify-content:space-between;gap:8px
}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:'+';color:var(--ui-dim);font-family:var(--mono)}
.sec[open]>summary::after{content:'–'}
.sec[open]>summary{border-bottom:1px solid var(--ui-line)}
.secbody{padding:12px}
.fld{margin-bottom:11px}
.fld:last-child{margin-bottom:0}
.fld label{display:block;font-size:11.5px;color:var(--ui-dim);margin-bottom:4px}
.fld input[type=text],.fld input[type=url],.fld input[type=number],.fld textarea,.fld select{
  width:100%;background:#0d152b;border:1px solid var(--ui-line);border-radius:8px;
  padding:7px 9px;font-size:13px;resize:vertical
}
.fld textarea{min-height:52px;line-height:1.45}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--ui-hot);outline:none}
.row{display:flex;gap:8px}
.row>*{flex:1}
.hint{font-size:11px;color:var(--ui-dim);margin-top:4px;line-height:1.45}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;
  background:#1d2745;border:1px solid var(--ui-line);border-radius:9px;padding:9px 12px;
  cursor:pointer;font-size:13px;font-weight:500
}
.btn:hover{border-color:#3d4b78;background:#243056}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
dialog ol{padding-left:20px;margin:6px 0;font-size:13px;color:#c3cce6;line-height:1.6}
dialog code{font-family:var(--mono);font-size:11.5px;background:#0d152b;padding:1px 5px;border-radius:4px}
.btn.primary:hover{background:#b81026;border-color:#b81026}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;gap:8px;margin-top:8px}
.btnrow .btn{width:auto}
.range{width:100%;accent-color:var(--ui-hot)}
.dl{display:grid;gap:8px;margin-top:4px}
.dl .btn{justify-content:flex-start}
.dl .btn small{color:var(--ui-dim);font-weight:400;margin-left:auto;font-size:11px}

.qual{border-radius:9px;padding:9px 11px;font-size:12px;line-height:1.45;margin-top:9px;border:1px solid}
.qual.good{background:#0f2a1d;border-color:#1f6b46;color:#8ff0bd}
.qual.warn{background:#2e2410;border-color:#8A5C00;color:#ffd98a}
.qual.bad{background:#2e1218;border-color:#8C0E1E;color:#ffb3bf}
.qual b{display:block;font-size:12.5px;margin-bottom:2px}
.qual code{font-family:var(--mono);font-size:11.5px}

.note{font-size:11.5px;line-height:1.5;color:var(--ui-dim);background:#0d152b;
  border:1px solid var(--ui-line);border-left:3px solid var(--gold);border-radius:8px;padding:9px 11px}
.note b{color:#ffd98a}

.status{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;
  background:#0c1226;border:1px solid var(--ui-line);border-radius:10px;padding:10px 16px;
  font-size:13px;box-shadow:0 12px 40px rgba(0,0,0,.6);display:none;max-width:80vw}
.status.show{display:block}
.status.err{border-color:var(--red);color:#ffb3bf}

/* inline text editing overlay */
.inline-edit{
  position:absolute;z-index:20;margin:0;padding:0;border:0;background:rgba(127,168,255,.10);
  outline:2px solid var(--ui-hot);border-radius:2px;overflow:hidden;resize:none;
  white-space:pre-wrap;word-break:break-word;
}
.edit-hot{cursor:text}
.edit-hot:hover{outline:1.5px dashed rgba(0,36,125,.55);outline-offset:2px}
.imgframe-hot{cursor:grab}
.imgframe-hot:active{cursor:grabbing}

.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ui-dim);
  padding:0 16px 10px}
.legend i{display:inline-block;width:16px;height:0;border-top:2px dashed;vertical-align:middle;margin-right:5px}

dialog{border:1px solid var(--ui-line);background:var(--ui-panel);color:var(--ui-text);
  border-radius:14px;max-width:640px;padding:0}
dialog::backdrop{background:rgba(5,8,18,.7)}
dialog .dlgbody{padding:20px 22px}
dialog h2{font-family:var(--sora);font-size:17px;margin:0 0 10px}
dialog h3{font-family:var(--sora);font-size:13.5px;margin:16px 0 6px}
dialog p,dialog li{font-size:13px;color:#c3cce6;line-height:1.55}
dialog ul{padding-left:18px;margin:6px 0}

@media (max-width:900px){
  .work{flex-direction:column}
  .panel{flex:0 0 auto;max-width:none;width:100%;border-right:0;border-bottom:1px solid var(--ui-line);
    max-height:46vh}
  .stage{padding:14px 10px 60px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brandmark"><b>TCA Print Studio</b><span>flyers &amp; pull-up banners</span></div>
  <label class="guide-toggle" id="guideToggle">
    <input type="checkbox" id="guides">
    <span>Show safe margins and platform keep-out zones</span>
  </label>
  <span class="spacer"></span>
  <button class="helpbtn" id="helpBtn">Print notes &amp; checks</button>
</header>

<nav class="tabs" id="tabs" role="tablist"></nav>
<div class="legend" id="legend" hidden>
  <span><i style="border-color:#00c07a"></i>Safe area — keep logos, text, QR inside</span>
  <span><i style="border-color:#CF142B"></i>Trim line (final size)</span>
  <span><i style="border-color:#FFB81C"></i>Bleed edge</span>
  <span id="legendKeep" hidden><i style="border-color:#ff7ab8"></i>Cassette keep-out / top rail</span>
  <span id="legendEye" hidden><i style="border-color:#4A90D9"></i>Comfortable eye &amp; scan height</span>
</div>

<div class="work">
  <aside class="panel" id="panel"></aside>
  <div class="stagewrap" id="stagewrap">
    <div class="stagebar">
      <span class="pill" id="dimPill"></span>
      <span class="pill" id="zoomPill"></span>
      <button class="helpbtn" id="zoomOut">−</button>
      <button class="helpbtn" id="zoomIn">+</button>
      <button class="helpbtn" id="zoomFit">Fit</button>
      <span id="tipText">Click any text on the artwork to edit it in place.</span>
    </div>
    <div class="stage"><div class="paper" id="paper"></div></div>
  </div>
</div>

<div class="status" id="status"></div>

<dialog id="helpDlg"><div class="dlgbody" id="helpBody"></div></dialog>

<script>
/* =========================================================
   Compact QR encoder — byte mode, versions 1..20, ECC L/M/Q/H
   Returns a 2-D array of 0/1 modules.
   ========================================================= */
var QR = (function () {
  /* EC codewords per block, and block structure, per version 1..20
     order: [L, M, Q, H] -> [ecPerBlock, numBlocksG1, numBlocksG2] */
  var ECB = {
    1: [[7, 1, 0], [10, 1, 0], [13, 1, 0], [17, 1, 0]],
    2: [[10, 1, 0], [16, 1, 0], [22, 1, 0], [28, 1, 0]],
    3: [[15, 1, 0], [26, 1, 0], [18, 2, 0], [22, 2, 0]],
    4: [[20, 1, 0], [18, 2, 0], [26, 2, 0], [16, 4, 0]],
    5: [[26, 1, 0], [24, 2, 0], [18, 2, 2], [22, 2, 2]],
    6: [[18, 2, 0], [16, 4, 0], [24, 4, 0], [28, 4, 0]],
    7: [[20, 2, 0], [18, 4, 0], [18, 2, 4], [26, 4, 1]],
    8: [[24, 2, 0], [22, 2, 2], [22, 4, 2], [26, 4, 2]],
    9: [[30, 2, 0], [22, 3, 2], [20, 4, 4], [24, 4, 4]],
    10: [[18, 2, 2], [26, 4, 1], [24, 6, 2], [28, 6, 2]],
    11: [[20, 4, 0], [30, 1, 4], [28, 4, 4], [24, 3, 8]],
    12: [[24, 2, 2], [22, 6, 2], [26, 4, 6], [28, 7, 4]],
    13: [[26, 4, 0], [22, 8, 1], [24, 8, 4], [22, 12, 4]],
    14: [[30, 3, 1], [24, 4, 5], [20, 11, 5], [24, 11, 5]],
    15: [[22, 5, 1], [24, 5, 5], [30, 5, 7], [24, 11, 7]],
    16: [[24, 5, 1], [28, 7, 3], [24, 15, 2], [30, 3, 13]],
    17: [[28, 1, 5], [28, 10, 1], [28, 1, 15], [28, 2, 17]],
    18: [[30, 5, 1], [26, 9, 4], [28, 17, 1], [28, 2, 19]],
    19: [[28, 3, 4], [26, 3, 11], [26, 17, 4], [26, 9, 16]],
    20: [[28, 3, 5], [26, 3, 13], [30, 15, 5], [28, 15, 10]]
  };
  /* total codewords per version 1..20 */
  var TOTAL = [null, 26, 44, 70, 100, 134, 172, 196, 242, 292, 346, 404, 466, 532, 581, 655, 733, 815, 901, 991, 1085];
  var ALIGN = {
    1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30], 6: [6, 34],
    7: [6, 22, 38], 8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50],
    11: [6, 30, 54], 12: [6, 32, 58], 13: [6, 34, 62], 14: [6, 26, 46, 66],
    15: [6, 26, 48, 70], 16: [6, 26, 50, 74], 17: [6, 30, 54, 78],
    18: [6, 30, 56, 82], 19: [6, 30, 58, 86], 20: [6, 34, 62, 90]
  };
  var ECI = { L: 0, M: 1, Q: 2, H: 3 };
  var FMTBITS = { L: 1, M: 0, Q: 3, H: 2 };

  /* ---- GF(256) ---- */
  var EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  (function () {
    var x = 1;
    for (var i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
    for (var j = 255; j < 512; j++) EXP[j] = EXP[j - 255];
  })();
  function gmul(a, b) { return (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]]; }

  function genPoly(n) {
    var p = [1];
    for (var i = 0; i < n; i++) {
      var np = new Array(p.length + 1).fill(0);
      for (var j = 0; j < p.length; j++) {
        np[j] ^= p[j];
        np[j + 1] ^= gmul(p[j], EXP[i]);
      }
      p = np;
    }
    return p;
  }
  function ecc(data, n) {
    var g = genPoly(n), res = data.slice().concat(new Array(n).fill(0));
    for (var i = 0; i < data.length; i++) {
      var f = res[i];
      if (f !== 0) for (var j = 0; j < g.length; j++) res[i + j] ^= gmul(g[j], f);
    }
    return res.slice(data.length);
  }

  function capacityBytes(ver, lvl) {
    var e = ECB[ver][ECI[lvl]], blocks = e[1] + e[2];
    var dataCw = TOTAL[ver] - e[0] * blocks;
    var ccBits = ver < 10 ? 8 : 16;
    return Math.floor((dataCw * 8 - 4 - ccBits) / 8);
  }

  function encode(text, lvl) {
    lvl = lvl || 'M';
    var bytes = [];
    for (var i = 0; i < text.length; i++) {
      var c = text.charCodeAt(i);
      if (c < 0x80) bytes.push(c);
      else if (c < 0x800) { bytes.push(0xc0 | (c >> 6), 0x80 | (c & 63)); }
      else { bytes.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63)); }
    }
    var ver = 0;
    for (var v = 1; v <= 20; v++) if (capacityBytes(v, lvl) >= bytes.length) { ver = v; break; }
    if (!ver) throw new Error('Text too long for QR (max ' + capacityBytes(20, lvl) + ' bytes)');

    var e = ECB[ver][ECI[lvl]], ecPer = e[0], g1 = e[1], g2 = e[2], blocks = g1 + g2;
    var dataCw = TOTAL[ver] - ecPer * blocks;
    var per1 = Math.floor(dataCw / blocks), per2 = per1 + 1;

    /* bit stream */
    var bits = [];
    function push(val, n) { for (var k = n - 1; k >= 0; k--) bits.push((val >> k) & 1); }
    push(4, 4);
    push(bytes.length, ver < 10 ? 8 : 16);
    for (var b = 0; b < bytes.length; b++) push(bytes[b], 8);
    var cap = dataCw * 8;
    for (var t = 0; t < 4 && bits.length < cap; t++) bits.push(0);
    while (bits.length % 8) bits.push(0);
    var pads = [0xEC, 0x11], pi = 0;
    while (bits.length < cap) { push(pads[pi++ % 2], 8); }

    var cw = [];
    for (var q = 0; q < bits.length; q += 8) {
      var byte = 0;
      for (var r = 0; r < 8; r++) byte = (byte << 1) | bits[q + r];
      cw.push(byte);
    }

    /* split into blocks */
    var dblocks = [], eblocks = [], pos = 0;
    for (var bi = 0; bi < blocks; bi++) {
      var len = bi < g1 ? per1 : per2;
      var blk = cw.slice(pos, pos + len); pos += len;
      dblocks.push(blk);
      eblocks.push(ecc(blk, ecPer));
    }
    var final = [];
    for (var c1 = 0; c1 < per2; c1++)
      for (var bj = 0; bj < blocks; bj++) if (c1 < dblocks[bj].length) final.push(dblocks[bj][c1]);
    for (var c2 = 0; c2 < ecPer; c2++)
      for (var bk = 0; bk < blocks; bk++) final.push(eblocks[bk][c2]);

    /* ---- matrix ---- */
    var size = ver * 4 + 17;
    var m = [], res = [];
    for (var y = 0; y < size; y++) { m.push(new Array(size).fill(0)); res.push(new Array(size).fill(0)); }
    function setF(x, y, v) { m[y][x] = v; res[y][x] = 1; }

    function finder(cx, cy) {
      for (var dy = -1; dy <= 7; dy++) for (var dx = -1; dx <= 7; dx++) {
        var x = cx + dx, y = cy + dy;
        if (x < 0 || y < 0 || x >= size || y >= size) continue;
        var inr = (dx >= 0 && dx <= 6 && dy >= 0 && dy <= 6);
        var on = inr && ((dx === 0 || dx === 6 || dy === 0 || dy === 6) ||
          (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4));
        setF(x, y, on ? 1 : 0);
      }
    }
    finder(0, 0); finder(size - 7, 0); finder(0, size - 7);

    for (var i2 = 8; i2 < size - 8; i2++) { setF(i2, 6, i2 % 2 === 0 ? 1 : 0); setF(6, i2, i2 % 2 === 0 ? 1 : 0); }

    var ac = ALIGN[ver];
    for (var ai = 0; ai < ac.length; ai++) for (var aj = 0; aj < ac.length; aj++) {
      var ax = ac[ai], ay = ac[aj];
      if ((ax <= 8 && ay <= 8) || (ax <= 8 && ay >= size - 9) || (ax >= size - 9 && ay <= 8)) continue;
      for (var dy2 = -2; dy2 <= 2; dy2++) for (var dx2 = -2; dx2 <= 2; dx2++) {
        var on2 = (Math.abs(dx2) === 2 || Math.abs(dy2) === 2 || (dx2 === 0 && dy2 === 0));
        setF(ax + dx2, ay + dy2, on2 ? 1 : 0);
      }
    }
    setF(8, size - 8, 1); // dark module

    /* reserve format areas */
    for (var f = 0; f < 9; f++) {
      if (f !== 6) { if (!res[f][8]) setF(8, f, 0); if (!res[8][f]) setF(f, 8, 0); }
    }
    for (var f2 = 0; f2 < 8; f2++) {
      if (!res[size - 1 - f2][8]) setF(8, size - 1 - f2, 0);
      if (!res[8][size - 1 - f2]) setF(size - 1 - f2, 8, 0);
    }
    if (ver >= 7) {
      for (var vi = 0; vi < 18; vi++) {
        var vx = Math.floor(vi / 3), vy = vi % 3;
        setF(vx, size - 11 + vy, 0); setF(size - 11 + vy, vx, 0);
      }
    }

    /* place data */
    var di = 0, bitIdx = 0, up = true;
    for (var col = size - 1; col > 0; col -= 2) {
      if (col === 6) col--;
      for (var rr = 0; rr < size; rr++) {
        var row = up ? size - 1 - rr : rr;
        for (var s = 0; s < 2; s++) {
          var cx2 = col - s;
          if (res[row][cx2]) continue;
          var bit = 0;
          if (di < final.length * 8) bit = (final[di >> 3] >> (7 - (di & 7))) & 1;
          di++;
          m[row][cx2] = bit;
        }
      }
      up = !up;
    }

    function maskFn(k, x, y) {
      switch (k) {
        case 0: return (x + y) % 2 === 0;
        case 1: return y % 2 === 0;
        case 2: return x % 3 === 0;
        case 3: return (x + y) % 3 === 0;
        case 4: return (Math.floor(y / 2) + Math.floor(x / 3)) % 2 === 0;
        case 5: return ((x * y) % 2) + ((x * y) % 3) === 0;
        case 6: return (((x * y) % 2) + ((x * y) % 3)) % 2 === 0;
        case 7: return (((x + y) % 2) + ((x * y) % 3)) % 2 === 0;
      }
    }
    function fmtBits(lv, k) {
      var d = (FMTBITS[lv] << 3) | k, r = d << 10;
      for (var i3 = 14; i3 >= 10; i3--) if ((r >> i3) & 1) r ^= 0x537 << (i3 - 10);
      return ((d << 10) | r) ^ 0x5412;
    }
    function verBits(v2) {
      var r2 = v2 << 12;

/* ============================================================
   Minimal layered PSD writer  —  RGB / 8-bit / RLE (PackBits)
   Layers are supplied bottom-to-top.
   layer = { name, x, y, w, h, rgba:Uint8Array(w*h*4), hidden }
   ============================================================ */

function ByteWriter(initial) {
  this.buf = new Uint8Array(initial || 1 << 20);
  this.len = 0;
}
ByteWriter.prototype._need = function (n) {
  if (this.len + n <= this.buf.length) return;
  var cap = this.buf.length;
  while (cap < this.len + n) cap *= 2;
  var nb = new Uint8Array(cap);
  nb.set(this.buf.subarray(0, this.len));
  this.buf = nb;
};
ByteWriter.prototype.u8 = function (v) { this._need(1); this.buf[this.len++] = v & 255; return this; };
ByteWriter.prototype.u16 = function (v) { this._need(2); this.buf[this.len++] = (v >>> 8) & 255; this.buf[this.len++] = v & 255; return this; };
ByteWriter.prototype.i16 = function (v) { return this.u16(v < 0 ? v + 0x10000 : v); };
ByteWriter.prototype.u32 = function (v) {
  this._need(4);
  this.buf[this.len++] = (v >>> 24) & 255; this.buf[this.len++] = (v >>> 16) & 255;
  this.buf[this.len++] = (v >>> 8) & 255; this.buf[this.len++] = v & 255; return this;
};
ByteWriter.prototype.ascii = function (s) { for (var i = 0; i < s.length; i++) this.u8(s.charCodeAt(i) & 255); return this; };
ByteWriter.prototype.bytes = function (arr) { this._need(arr.length); this.buf.set(arr, this.len); this.len += arr.length; return this; };
ByteWriter.prototype.zeros = function (n) { this._need(n); for (var i = 0; i < n; i++) this.buf[this.len++] = 0; return this; };
ByteWriter.prototype.patchU32 = function (pos, v) {
  this.buf[pos] = (v >>> 24) & 255; this.buf[pos + 1] = (v >>> 16) & 255;
  this.buf[pos + 2] = (v >>> 8) & 255; this.buf[pos + 3] = v & 255;
};
ByteWriter.prototype.out = function () { return this.buf.subarray(0, this.len); };

/* PackBits, one scanline at a time. Returns {data, counts} */
function packBits(src, width, height) {
  var out = new Uint8Array(height * (width + Math.ceil(width / 128) + 8));
  var o = 0, counts = new Uint16Array(height);
  for (var y = 0; y < height; y++) {
    var rowStart = y * width, i = 0, start = o;
    while (i < width) {
      // count a run
      var run = 1;
      while (i + run < width && run < 128 && src[rowStart + i + run] === src[rowStart + i]) run++;
      if (run > 1) {
        out[o++] = 257 - run;         // (-run+1) as unsigned byte
        out[o++] = src[rowStart + i];
        i += run;
      } else {
        // literal span: stop when 3 identical bytes appear ahead
        var lit = 1;
        while (i + lit < width && lit < 128) {
          if (i + lit + 2 < width &&
            src[rowStart + i + lit] === src[rowStart + i + lit + 1] &&
            src[rowStart + i + lit] === src[rowStart + i + lit + 2]) break;
          lit++;
        }
        out[o++] = lit - 1;
        for (var k = 0; k < lit; k++) out[o++] = src[rowStart + i + k];

function pascalPad4(w, s) {
  var bytes = [];
  for (var i = 0; i < s.length && bytes.length < 255; i++) {
    var c = s.charCodeAt(i);
    bytes.push(c < 256 ? c : 63);

  w.bytes(new Uint8Array(bytes));
  var total = 1 + bytes.length;

function luniBlock(w, name) {
  w.ascii('8BIM').ascii('luni');
  var lenPos = w.len; w.u32(0);
  var start = w.len;
  w.u32(name.length);
  for (var i = 0; i < name.length; i++) w.u16(name.charCodeAt(i));

/* main */
function buildPSD(docW, docH, layers, dpi) {
  dpi = dpi || 300;
  var w = new ByteWriter(1 << 22);

  /* ---- File header ---- */
  w.ascii('8BPS').u16(1).zeros(6).u16(3).u32(docH).u32(docW).u16(8).u16(3);

  /* ---- Colour mode data ---- */
  w.u32(0);

  /* ---- Image resources: 1005 ResolutionInfo ---- */

  var irStart = w.len;

  w.u32(Math.round(dpi * 65536)).u16(1).u16(1);
  w.u32(Math.round(dpi * 65536)).u16(1).u16(1);

  /* ---- Layer & mask information ---- */
  var lmPos = w.len; w.u32(0);
  var lmStart = w.len;

  var liStart = w.len;

    var L = layers[li];

  for (var li2 = 0; li2 < layers.length; li2++) {
    var Lr = layers[li2], pc = packed[li2];
    w.u32(Lr.y).u32(Lr.x).u32(Lr.y + Lr.h).u32(Lr.x + Lr.w);
    w.u16(4);
    var ids = [-1, 0, 1, 2];
    for (var c = 0; c < 4; c++) {
      w.i16(ids[c]);
      w.u32(2 + pc[c].counts.length * 2 + pc[c].data.length);
    }
    w.ascii('8BIM').ascii('norm');
    w.u8(255).u8(0).u8(Lr.hidden ? 2 : 0).u8(0);
    var exPos = w.len; w.u32(0);
    var exStart = w.len;
    w.u32(0);           // layer mask data
    w.u32(0);           // blending ranges
    pascalPad4(w, Lr.name);
    luniBlock(w, Lr.name);
    w.patchU32(exPos, w.len - exStart);
  }

  // channel image data
  for (var li3 = 0; li3 < layers.length; li3++) {
    var pc2 = packed[li3];
    for (var c2 = 0; c2 < 4; c2++) {
      w.u16(1);
      for (var r = 0; r < pc2[c2].counts.length; r++) w.u16(pc2[c2].counts[r]);
      w.bytes(pc2[c2].data);
    }
  }

  var liLen = w.len - liStart;
  if (liLen % 2) { w.zeros(1); liLen++; }
  w.patchU32(liPos, liLen);

  w.u32(0); // global layer mask info

  var lmLen = w.len - lmStart;
  if (lmLen % 2) { w.zeros(1); lmLen++; }
  w.patchU32(lmPos, lmLen);

  /* ---- Merged composite (white-backed flatten) ---- */
  var np = docW * docH;
  var R = new Uint8Array(np), G = new Uint8Array(np), B = new Uint8Array(np);
  R.fill(255); G.fill(255); B.fill(255);
  for (var li4 = 0; li4 < layers.length; li4++) {
    var Ll = layers[li4];
    if (Ll.hidden) continue;
    for (var yy = 0; yy < Ll.h; yy++) {
      var dy = Ll.y + yy; if (dy < 0 || dy >= docH) continue;
      for (var xx = 0; xx < Ll.w; xx++) {
        var dx = Ll.x + xx; if (dx < 0 || dx >= docW) continue;
        var s = (yy * Ll.w + xx) * 4, a = Ll.rgba[s + 3];
        if (!a) continue;

        R[d] = (Ll.rgba[s] * a + R[d] * ia + 127) / 255 | 0;
        G[d] = (Ll.rgba[s + 1] * a + G[d] * ia + 127) / 255 | 0;
        B[d] = (Ll.rgba[s + 2] * a + B[d] * ia + 127) / 255 | 0;
      }
    }
  }
  var pr = packBits(R, docW, docH), pg = packBits(G, docW, docH), pb = packBits(B, docW, docH);
  w.u16(1);
  var all = [pr, pg, pb];
  for (var q = 0; q < 3; q++) for (var rr = 0; rr < docH; rr++) w.u16(all[q].counts[rr]);
  for (var q2 = 0; q2 < 3; q2++) w.bytes(all[q2].data);

  return w.out();
}

/* =========================================================
   Minimal print-ready PDF writer.
   One page, one DCTDecode (JPEG) image placed across the
   bleed box, vector crop marks + slug line in 100% K.

   ========================================================= */
function buildPrintPDF(opts) {
  var MM = 72 / 25.4;
  var trimW = opts.trimWmm, trimH = opts.trimHmm;
  var bleed = opts.bleedMm;
  var markLen = opts.markLenMm != null ? opts.markLenMm : 5;
  var markGap = opts.markGapMm != null ? opts.markGapMm : 0;   // offset beyond bleed
  var margin = bleed + markGap + markLen + 4;                   // page padding around trim

  var pageW = (trimW + margin * 2) * MM;
  var pageH = (trimH + margin * 2) * MM;
  var trimX = margin * MM, trimY = margin * MM;
  var trimWpt = trimW * MM, trimHpt = trimH * MM;
  var bleedX = (margin - bleed) * MM, bleedY = (margin - bleed) * MM;
  var bleedWpt = (trimW + bleed * 2) * MM, bleedHpt = (trimH + bleed * 2) * MM;

  /* ---- content stream ---- */
  var c = [];
  c.push('q');
  c.push(f(bleedWpt) + ' 0 0 ' + f(bleedHpt) + ' ' + f(bleedX) + ' ' + f(bleedY) + ' cm');
  c.push('/Im0 Do');
  c.push('Q');

  c.push('q 0 0 0 1 k ' + f(0.25 * MM) + ' w 0 J');
  var L = markLen * MM, G = markGap * MM;
  function mark(x1, y1, x2, y2) { c.push(f(x1) + ' ' + f(y1) + ' m ' + f(x2) + ' ' + f(y2) + ' l S'); }
  var bx0 = bleedX, by0 = bleedY, bx1 = bleedX + bleedWpt, by1 = bleedY + bleedHpt;
  var tx0 = trimX, ty0 = trimY, tx1 = trimX + trimWpt, ty1 = trimY + trimHpt;
  // horizontal marks (left & right of trim corners)
  mark(bx0 - G, ty0, bx0 - G - L, ty0); mark(bx0 - G, ty1, bx0 - G - L, ty1);
  mark(bx1 + G, ty0, bx1 + G + L, ty0); mark(bx1 + G, ty1, bx1 + G + L, ty1);
  // vertical marks (below & above trim corners)
  mark(tx0, by0 - G, tx0, by0 - G - L); mark(tx1, by0 - G, tx1, by0 - G - L);
  mark(tx0, by1 + G, tx0, by1 + G + L); mark(tx1, by1 + G, tx1, by1 + G + L);
  c.push('Q');

  if (opts.slug) {
    c.push('q 0 0 0 1 k BT /F1 ' + f(6) + ' Tf ' + f(trimX) + ' ' + f(margin * MM / 2 - 3) + ' Td (' + esc(opts.slug) + ') Tj ET Q');
  }

  var objs = [];
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  objs[2] = '<< /Type /Pages /Kids [3 0 R] /Count 1 >>';
  objs[3] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + f(pageW) + ' ' + f(pageH) + '] ' +
    '/BleedBox [' + f(bleedX) + ' ' + f(bleedY) + ' ' + f(bleedX + bleedWpt) + ' ' + f(bleedY + bleedHpt) + '] ' +
    '/TrimBox [' + f(tx0) + ' ' + f(ty0) + ' ' + f(tx1) + ' ' + f(ty1) + '] ' +
    '/ArtBox [' + f(tx0) + ' ' + f(ty0) + ' ' + f(tx1) + ' ' + f(ty1) + '] ' +

  objs[6] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';

  function writeObj(n, body, streamBytes) {
    offsets[n] = pos;

    if (streamBytes) {

  writeObj(4, '<< /Length ' + cb.length + ' >>', cb);
  writeObj(5, '<< /Type /XObject /Subtype /Image /Width ' + opts.pxW + ' /Height ' + opts.pxH +

  for (k = 0; k < chunks.length; k++) total += chunks[k].length;

<script>
/* =====================================================================
   TCA Print Studio — artwork engine
   Every coordinate in this file is millimetres at final print size.
   The SVG viewBox is the bleed box; trim origin sits at (bleed, bleed).
   ===================================================================== */

var BR = {
  blue: '#00247D', blueD: '#001A5C', red: '#CF142B', redD: '#8C0E1E',
  gold: '#FFB81C', goldD: '#8A5C00', sky: '#4A90D9', skyD: '#1D4E89',
  ink: '#0B1C39', char: '#4A5568', cloud: '#F4F6FB', white: '#FFFFFF'
};
var FAM = { sora: "'TCA Sora'", inter: "'TCA Inter'", mono: "'TCA Mono'" };


/* ---------- text measurement (canvas, 10× oversampled for precision) ---------- */
var _mctx = document.createElement('canvas').getContext('2d');
var K = 10;
function setFont(fam, w, sizeMM) { _mctx.font = w + ' ' + (sizeMM * K) + 'px ' + FAM[fam] + ', sans-serif'; }
function widthMM(t, fam, w, sizeMM, ls) {
  setFont(fam, w, sizeMM);
  return _mctx.measureText(t).width / K + (ls || 0) * Math.max(0, t.length - 1);
}
function wrapLines(text, fam, w, sizeMM, maxW, ls) {
  var out = [];
  String(text).split('\n').forEach(function (para) {
    var words = para.split(/\s+/).filter(Boolean);
    if (!words.length) { out.push(''); return; }
    var line = words[0];
    for (var i = 1; i < words.length; i++) {
      var t = line + ' ' + words[i];
      if (widthMM(t, fam, w, sizeMM, ls) <= maxW) line = t;
      else { out.push(line); line = words[i]; }
    }
    out.push(line);
  });
  return out;
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function n(v) { return Math.round(v * 1000) / 1000; }

/* ---------- text block ----------
   Returns {svg, lines, first, last, height}. y = baseline of first line. */
function T(o) {
  var fam = o.fam || 'inter', w = o.w || 400, s = o.size, lh = o.lh || 1.3;
  var ls = o.ls || 0, maxW = o.maxW || 1e6;
  var lines = o.nowrap ? String(o.text).split('\n') : wrapLines(o.text, fam, w, s, maxW, ls);
  if (o.maxLines && lines.length > o.maxLines) lines = lines.slice(0, o.maxLines);
  var anchor = o.anchor || 'start';
  var step = s * lh;
  var body = lines.map(function (ln, i) {
    return '<tspan x="' + n(o.x) + '" dy="' + (i === 0 ? 0 : n(step)) + '">' + esc(ln) + '</tspan>';
  }).join('');
  var svg = '<text x="' + n(o.x) + '" y="' + n(o.y) + '" fill="' + (o.fill || BR.ink) +
    '" font-family="' + FAM[fam] + ',sans-serif" font-weight="' + w +
    '" font-size="' + n(s) + '" text-anchor="' + anchor + '"' +
    (ls ? ' letter-spacing="' + n(ls) + '"' : '') +
    (o.op != null ? ' fill-opacity="' + o.op + '"' : '') +
    ' xml:space="preserve">' + body + '</text>';
  if (o.field) {
    svg = '<g class="edit-hot" data-field="' + o.field + '" data-size="' + n(s) +
      '" data-lh="' + lh + '" data-anchor="' + anchor + '" data-fam="' + fam +
      '" data-weight="' + w + '" data-fill="' + (o.fill || BR.ink) + '">' + svg + '</g>';
  }
  return {
    svg: svg, lines: lines, height: (lines.length - 1) * step + s,
    last: o.y + (lines.length - 1) * step, bottom: o.y + (lines.length - 1) * step + s * 0.28
  };
}

/* ---------- primitives ---------- */
function rect(x, y, w, h, fill, o) {
  o = o || {};
  return '<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(w) + '" height="' + n(h) +
    '" fill="' + fill + '"' + (o.rx ? ' rx="' + n(o.rx) + '"' : '') +
    (o.op != null ? ' fill-opacity="' + o.op + '"' : '') +
    (o.stroke ? ' stroke="' + o.stroke + '" stroke-width="' + n(o.sw || 0.4) + '"' : '') + '/>';
}
function line(x1, y1, x2, y2, stroke, sw, dash) {
  return '<line x1="' + n(x1) + '" y1="' + n(y1) + '" x2="' + n(x2) + '" y2="' + n(y2) +
    '" stroke="' + stroke + '" stroke-width="' + n(sw) + '"' +
    (dash ? ' stroke-dasharray="' + dash + '"' : '') + ' stroke-linecap="butt"/>';
}
/* rounded "pill" chip with centred label */
function chip(x, y, label, o) {
  o = o || {};
  var s = o.size || 3, padX = o.padX || (s * 1.1), h = o.h || s * 2.5;
  var w = widthMM(label, 'inter', 600, s) + padX * 2;
  var g = rect(x, y, w, h, o.fill || 'none', { rx: h / 2, stroke: o.stroke, sw: o.sw || 0.35, op: o.op });
  g += T({
    x: x + w / 2, y: y + h / 2 + s * 0.36, text: label, fam: 'inter', w: 600,
    size: s, fill: o.color || BR.ink, anchor: 'middle', nowrap: true, op: o.textOp
  }).svg;
  return { svg: g, w: w, h: h };

/* forward chevron used as the "next step" marker */
function chevron(x, y, size, color, sw) {
  return '<path d="M' + n(x) + ',' + n(y - size) + ' L' + n(x + size * 0.62) + ',' + n(y) +
    ' L' + n(x) + ',' + n(y + size) + '" fill="none" stroke="' + color +
    '" stroke-width="' + n(sw || size * 0.28) + '" stroke-linecap="round" stroke-linejoin="round"/>';
}
/* the runner's motion-lines device, reused as a brand graphic */
function motionBars(x, y, w, h, cols, skew) {
  var out = '', gap = h / (cols.length * 1.55), bw = gap * 0.62;
  for (var i = 0; i < cols.length; i++) {
    var yy = y + i * gap;
    out += '<path d="M' + n(x) + ',' + n(yy) + ' L' + n(x + w) + ',' + n(yy - (skew || 0)) +
      ' L' + n(x + w) + ',' + n(yy - (skew || 0) + bw) + ' L' + n(x) + ',' + n(yy + bw) +
      ' Z" fill="' + cols[i] + '"/>';
  }
  return out;
}

/* ---------- signature 115° Royal Blue → Red gradient ---------- */
function gradDef(id) {
  return '<linearGradient id="' + id + '" x1="-0.102" y1="0.219" x2="1.102" y2="0.781">' +
    '<stop offset="0" stop-color="' + BR.blue + '"/><stop offset="1" stop-color="' + BR.red + '"/></linearGradient>';
}

/* ---------- logo ---------- */
var LOGO = { ready: false, inner: '', vb: [0, 0, 1000, 300], aspect: 1000 / 300, href: null, failed: false };
function logoSVG(x, y, w, opts) {
  opts = opts || {};

    return '<svg x="' + n(x) + '" y="' + n(y) + '" width="' + n(w) + '" height="' + n(h) +
      '" viewBox="' + LOGO.vb.join(' ') + '" preserveAspectRatio="xMinYMid meet" overflow="visible">' +
      LOGO.inner + '</svg>';

    return '<image x="' + n(x) + '" y="' + n(y) + '" width="' + n(w) + '" height="' + n(h) +
      '" href="' + LOGO.href + '" preserveAspectRatio="xMinYMid meet"/>';
  }
  return rect(x, y, w, h, 'none', { stroke: BR.blue, sw: w * 0.006, rx: w * 0.01 }) +
    T({
      x: x + w / 2, y: y + h / 2, text: 'TCA logo', fam: 'sora', w: 700, size: h * 0.2,
      fill: BR.blue, anchor: 'middle', nowrap: true
    }).svg +
    T({
      x: x + w / 2, y: y + h / 2 + h * 0.26, text: 'loading — or upload it in the panel',
      fam: 'inter', w: 400, size: h * 0.11, fill: BR.char, anchor: 'middle', nowrap: true
    }).svg;
}
function logoH(w) { return w / LOGO.aspect; }

/* ---------- QR ---------- */
var _qrCache = {};
function qrModules(url) {

/* ---------- guides ---------- */
function guidesLayer(t, S) {
  var b = S.bleed, W = t.trim[0], H = t.trim[1], safe = t.safe;
  var g = '';
  var sw = Math.max(0.25, W / 500);
  /* bleed edge */
  g += rect(0, 0, W + b * 2, H + b * 2, 'none', { stroke: BR.gold, sw: sw });
  /* trim */
  g += rect(b, b, W, H, 'none', { stroke: BR.red, sw: sw * 1.2 });
  /* safe */
  g += '<rect x="' + n(b + safe) + '" y="' + n(b + safe) + '" width="' + n(W - safe * 2) +
    '" height="' + n(H - safe * 2) + '" fill="none" stroke="#00C07A" stroke-width="' + n(sw * 1.2) +
    '" stroke-dasharray="' + n(sw * 8) + ' ' + n(sw * 6) + '"/>';
  var lab = function (x, y, txt, fill, anchor) {
    return T({ x: x, y: y, text: txt, fam: 'inter', w: 600, size: Math.max(2, W / 90), fill: fill, anchor: anchor || 'start', nowrap: true }).svg;
  };
  g += lab(b + safe + sw * 3, b + safe + W / 60, 'Safe area · ' + safe + 'mm', '#00C07A');
  g += lab(b + 1, b - sw * 3, 'Trim ' + W + ' × ' + H + 'mm', BR.red);
  g += lab(0.6, sw * 3 + W / 70, 'Bleed ' + b + 'mm', BR.goldD);

  if (t.keepout) {
    var ko = t.keepout;
    if (ko.bottom) {
      var y0 = b + H - ko.bottom;

      g += line(b, y0, b + W, y0, '#FF7AB8', sw * 1.6, n(sw * 10) + ' ' + n(sw * 7));
      g += lab(b + safe, y0 + W / 45, 'Cassette keep-out · bottom ' + ko.bottom + 'mm hidden by the base', '#FF3D9B');
    }
    if (ko.top) {
      g += rect(b, b, W, ko.top, '#FF7AB8', { op: 0.16 });
      g += line(b, b + ko.top, b + W, b + ko.top, '#FF7AB8', sw * 1.6, n(sw * 10) + ' ' + n(sw * 7));
      g += lab(b + safe, b + ko.top - W / 90, 'Top rail / leader · ' + ko.top + 'mm', '#FF3D9B');
    }

    var e0 = b + H - t.eyeline[1], e1 = b + H - t.eyeline[0];
    g += rect(b, e0, W, e1 - e0, BR.sky, { op: 0.13 });
    g += line(b, e0, b + W, e0, BR.sky, sw, n(sw * 6) + ' ' + n(sw * 5));

  }
  return g;
}

    motionBars(b + W - 260, kY + 24, 280 + b, 140, [BR.white, BR.white, BR.gold], 40);

<script>
/* =====================================================================
   TCA Print Studio — editor, guides and export pipeline
   ===================================================================== */
(function () {
  'use strict';

  var LOGO_URL = 'https://suvrasispal.github.io/TCA/brand/logo-primary.svg';
  var SITE = 'https://suvrasispal.github.io/TCA/';
  var WAITLIST = 'https://suvrasispal.github.io/TCA/#waitlist';

  /* ---------------- shared, source-checked copy ---------------- */
  function baseText() {

  /* ---------------- template registry ---------------- */
  var TPL = {
    a5a: {
      label: 'Template A · Deposit ladder', group: 'A5 flyers', accent: 'grad',
      kind: 'a5', trim: [148, 210], bleed: 3, safe: 8,
      dpi: 300, psdDpi: 300, minDpi: [200, 300],
      render: renderA5A, imageLabel: 'Footer photo band (optional)',
      imageNote: 'This template is typography-led. The photo only sits behind the dark footer band, so it is optional.',
      text: function () {

        return t;
      }
    },
    a5b: {
      label: 'Template B · Room energy', group: 'A5 flyers', accent: 'blue',
      kind: 'a5', trim: [148, 210], bleed: 3, safe: 8,
      dpi: 300, psdDpi: 300, minDpi: [200, 300],
      render: renderA5B, imageLabel: 'Hero photograph',
      imageNote: 'Candid, in motion, joyful — never posed. A flat 18% Royal Blue tint is applied automatically.',
      text: function () {

        t.headline = 'Most people arrive on their own.\nAlmost nobody leaves that way.';

        return t;
      }
    },
    banA: {
      label: 'Template A · Vertical ladder', group: 'Pull-up banners', accent: 'grad',
      kind: 'banner', trim: [850, 2000], bleed: 20, safe: 50,
      keepout: { bottom: 150, top: 40 }, eyeline: [900, 1600],
      dpi: 150, psdDpi: 72, minDpi: [100, 150],
      render: renderBanA, imageLabel: 'Lower photo band (optional)',

        var t = baseText();

    },
    banB: {
      label: 'Template B · Room energy', group: 'Pull-up banners', accent: 'red',
      kind: 'banner', trim: [850, 2000], bleed: 20, safe: 50,
      keepout: { bottom: 150, top: 40 }, eyeline: [900, 1600],
      dpi: 150, psdDpi: 72, minDpi: [100, 150],
      render: renderBanB, imageLabel: 'Hero photograph',
      imageNote: 'Fills the top half behind a flat scrim. Shoot or choose wide — the QR tile sits over the right-hand third.',
      text: function () {
        var t = baseText();
        t.headline = 'Most people arrive on their own.';
        t.sub = 'Dance-fitness and wellbeing sessions for absolutely everyone.';
        t.ctaTitle = 'Join the waitlist — no payment now';
        return t;
      }
    }
  };

  var ORDER = ['a5a', 'a5b', 'banA', 'banB'];
  var state = {}, current = 'a5a', showGuides = false, zoom = {}, editing = null, renderTimer = null;

  ORDER.forEach(function (k) {
    var t = TPL[k];
    state[k] = {
      text: t.text(), qrUrl: WAITLIST, bleed: t.bleed, dpi: t.dpi, psdDpi: t.psdDpi,
      image: null
    };
  });

  /* ---------------- helpers ---------------- */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function el(tag, attrs, html) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    if (html != null) e.innerHTML = html;
    return e;
  }
  function getField(S, path) {
    var p = path.split('.'), o = S.text;
    for (var i = 0; i < p.length; i++) o = o[p[i]];
    return o;
  }
  function setField(S, path, v) {
    var p = path.split('.'), o = S.text;
    for (var i = 0; i < p.length - 1; i++) o = o[p[i]];
    o[p[p.length - 1]] = v;
  }
  function status(msg, isErr, ms) {
    var s = $('#status');
    s.textContent = msg; s.className = 'status show' + (isErr ? ' err' : '');
    clearTimeout(status._t);
    if (ms !== 0) status._t = setTimeout(function () { s.className = 'status'; }, ms || 3200);
  }
  function download(blob, name) {
    var a = document.createElement('a'), u = URL.createObjectURL(blob);
    a.href = u; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(u); a.remove(); }, 4000);
  }
  function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }

  /* ---------------- logo loading ---------------- */
  function inlineLogo(svgText) {
    var doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
    var root = doc.documentElement;
    if (!root || root.nodeName.toLowerCase() !== 'svg') throw new Error('not an svg');
    var vb = root.getAttribute('viewBox');
    if (vb) LOGO.vb = vb.trim().split(/[\s,]+/).map(Number);
    else {
      var w = parseFloat(root.getAttribute('width')) || 1000, h = parseFloat(root.getAttribute('height')) || 300;
      LOGO.vb = [0, 0, w, h];
    }
    LOGO.aspect = LOGO.vb[2] / LOGO.vb[3];
    /* namespace ids so they cannot clash with our own defs */
    var inner = root.innerHTML;
    var ids = [];
    inner.replace(/id="([^"]+)"/g, function (m, id) { ids.push(id); return m; });
    ids.forEach(function (id) {
      var re = new RegExp('(["(#])' + id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(["):])', 'g');
      inner = inner.replace(new RegExp('id="' + id + '"', 'g'), 'id="tcal-' + id + '"');
      inner = inner.replace(new RegExp('url\\(#' + id + '\\)', 'g'), 'url(#tcal-' + id + ')');
      inner = inner.replace(new RegExp('href="#' + id + '"', 'g'), 'href="#tcal-' + id + '"');
    });
    LOGO.inner = inner; LOGO.ready = true; LOGO.failed = false;
  }
  function loadLogo() {
    fetch(LOGO_URL, { mode: 'cors' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (txt) { inlineLogo(txt); render(); })
      .catch(function () {
        LOGO.failed = true; render();
        status('Could not fetch the official logo from the TCA site (offline or blocked). Upload logo-primary.svg in the panel.', true, 7000);
      });
  }

  /* ---------------- SVG assembly ---------------- */
  function fontFaceCSS() {
    var out = '';
    for (var k in TCAFONTS) {
      var f = TCAFONTS[k];
      out += "@font-face{font-family:'" + f.fam + "';font-weight:" + f.w + ";font-style:normal;" +
        "src:url(data:font/woff2;base64," + f.b64 + ") format('woff2');}";
    }
    return out;
  }
  function buildSVG(tid, opt) {
    opt = opt || {};
    var t = TPL[tid], S = state[tid];
    var CW = t.trim[0] + S.bleed * 2, CH = t.trim[1] + S.bleed * 2;
    var r = t.render(S, t);
    var body = '';
    var keys = Object.keys(r.layers);
    keys.forEach(function (k) {
      if (opt.only && k !== opt.only) return;
      if (!r.layers[k]) return;
      body += '<g data-layer="' + esc(k) + '">' + r.layers[k] + '</g>';
    });
    if (opt.only === '__guides__') body = '<g data-layer="Guides (non-printing)">' + guidesLayer(t, S) + '</g>';
    else if (opt.guides) body += '<g data-layer="Guides (non-printing)" pointer-events="none">' + guidesLayer(t, S) + '</g>';

    var px = opt.px, py = opt.py;
    return '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" ' +
      'viewBox="0 0 ' + CW + ' ' + CH + '"' +
      (px ? ' width="' + px + '" height="' + py + '"' : ' width="' + CW + 'mm" height="' + CH + 'mm"') +
      '><defs>' + (opt.embedFonts ? '<style>' + fontFaceCSS() + '</style>' : '') + (r.defs || '') + '</defs>' +
      body + '</svg>';
  }

  /* ---------------- on-screen render ---------------- */
  function pxPerMM(tid) {
    if (zoom[tid]) return zoom[tid];
    var t = TPL[tid], wrap = $('#stagewrap');
    var availW = Math.max(240, wrap.clientWidth - 70);

    var CW = t.trim[0] + state[tid].bleed * 2, CH = t.trim[1] + state[tid].bleed * 2;
    var z = t.kind === 'banner' ? Math.min(availW / CW, availH / CH) : Math.min(availW / CW, availH / CH);
    zoom[tid] = Math.max(0.06, z);
    return zoom[tid];
  }
  function render() {
    var tid = current, t = TPL[tid], S = state[tid];
    var z = pxPerMM(tid);
    var CW = t.trim[0] + S.bleed * 2, CH = t.trim[1] + S.bleed * 2;
    var svg = buildSVG(tid, { guides: showGuides, px: Math.round(CW * z), py: Math.round(CH * z) });
    var paper = $('#paper');
    paper.style.width = Math.round(CW * z) + 'px';
    paper.style.height = Math.round(CH * z) + 'px';
    var host = $('#artHost');
    if (!host) { host = el('div', { id: 'artHost' }); paper.appendChild(host); }
    host.innerHTML = svg;
    $('#dimPill').textContent = t.trim[0] + ' × ' + t.trim[1] + ' mm trim  ·  ' + CW + ' × ' + CH + ' mm with ' + S.bleed + 'mm bleed';

  function closeEditor() {

  function openEditor(g) {

    var S = state[current], z = pxPerMM(current);
    var pr = $('#paper').getBoundingClientRect(), br = g.getBoundingClientRect();
    var size = parseFloat(g.getAttribute('data-size')) * z;
    var lh = parseFloat(g.getAttribute('data-lh')) || 1.3;
    var fam = { sora: "'TCA Sora'", inter: "'TCA Inter'", mono: "'TCA Mono'" }[g.getAttribute('data-fam')];

    ta.style.color = g.getAttribute('data-fill');

    ta.style.paddingLeft = padX + 'px';
    ta.value = getField(S, field);
    $('#paper').appendChild(ta);
    ta.focus(); ta.select();

  /* ---------------- image drag on canvas ---------------- */
  function bindArtwork() {
    var host = $('#artHost');
    Array.prototype.forEach.call(host.querySelectorAll('.edit-hot'), function (g) {
      g.addEventListener('mousedown', function (e) { e.preventDefault(); openEditor(g); });
    });
    var fr = host.querySelector('.imgframe-hot');
    if (!fr) return;
    fr.addEventListener('mousedown', function (e) {
      var S = state[current];
      if (!S.image || !S.image.src) return;
      e.preventDefault();
      var t = TPL[current], startX = e.clientX, startY = e.clientY;
      var z = pxPerMM(current), px0 = S.image.px, py0 = S.image.py;
      var fw = (t.trim[0] + S.bleed * 2) * z;
      function move(ev) {
        S.image.px = px0 + (ev.clientX - startX) / fw;
        S.image.py = py0 + (ev.clientY - startY) / fw;
        syncImageInputs(); reRender();
      }
      function up() { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); }
      window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
    });
  }

  /* ---------------- image quality ---------------- */
  function updateQuality() {
    var box = $('#qualBox'); if (!box) return;
    var S = state[current], t = TPL[current];
    if (!S.image || !S.image.src || !S.image._rendered) { box.hidden = true; return; }
    box.hidden = false;
    var widthMMrendered = S.image._rendered.dw;
    var dpi = S.image.natW / (widthMMrendered / 25.4);
    var lo = t.minDpi[0], hi = t.minDpi[1];
    var cls, head, msg;
    if (dpi >= hi) {
      cls = 'good'; head = '✔ Good for print';
      msg = 'Effective resolution at final size is comfortably above the ' + hi + ' DPI target for this format.';
    } else if (dpi >= lo) {
      cls = 'warn'; head = '⚠ Acceptable with caution';
      msg = 'Usable, but below the ' + hi + ' DPI ideal. Fine detail and small text in the photo may soften. Zooming in further will lower this again.';
    } else {
      cls = 'bad'; head = '⚠ Image Quality Warning';
      msg = 'This image may not have sufficient resolution for a ' + t.trim[0] + 'mm × ' + t.trim[1] +
        'mm print. Please upload a higher-resolution image to avoid pixelation.';
    }
    box.className = 'qual ' + cls;
    box.innerHTML = '<b>' + head + '</b>' + msg +
      '<div style="margin-top:6px"><code>' + S.image.natW + ' × ' + S.image.natH + ' px  →  ' +
      Math.round(dpi) + ' DPI at ' + Math.round(widthMMrendered) + 'mm wide</code></div>' +
      '<div style="margin-top:4px;opacity:.75"><code>thresholds: good ≥ ' + hi + ' · caution ≥ ' + lo + ' · low &lt; ' + lo + '</code></div>';
  }

  /* ---------------- rasterising ---------------- */
  function svgToImage(svg) {
    return new Promise(function (res, rej) {
      var blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var im = new Image();
      im.onload = function () { URL.revokeObjectURL(url); res(im); };
      im.onerror = function () { URL.revokeObjectURL(url); rej(new Error('SVG could not be rasterised')); };
      im.src = url;
    });
  }
  function rasterise(tid, dpi, opt) {
    opt = opt || {};
    var t = TPL[tid], S = state[tid];
    var CW = t.trim[0] + S.bleed * 2, CH = t.trim[1] + S.bleed * 2;
    var px = Math.round(CW * dpi / 25.4), py = Math.round(CH * dpi / 25.4);
    if (px > 16000 || py > 16000 || px * py > 200e6)
      return Promise.reject(new Error('Canvas limit: ' + px + '×' + py + 'px is more than a browser can rasterise. Lower the DPI.'));
    var svg = buildSVG(tid, {
      guides: false, embedFonts: true, px: px, py: py, only: opt.only
    });
    return svgToImage(svg).then(function (im) {
      var cv = document.createElement('canvas');
      cv.width = px; cv.height = py;
      var cx = cv.getContext('2d', { willReadFrequently: !!opt.transparent });
      if (!opt.transparent) { cx.fillStyle = '#fff'; cx.fillRect(0, 0, px, py); }
      cx.drawImage(im, 0, 0, px, py);
      return cv;
    });
  }
  function toBlob(cv, type, q) {
    return new Promise(function (res) { cv.toBlob(res, type, q); });
  }
  function fileStem(tid) {
    var t = TPL[tid];
    return 'TCA-' + (t.kind === 'a5' ? 'A5-flyer' : 'pullup-banner') + '-' +
      (tid.slice(-1) === 'a' || tid === 'banA' ? 'A' : 'B') + '-' + t.trim[0] + 'x' + t.trim[1] + 'mm';
  }

  function doJPG() {
    var tid = current, S = state[tid];
    status('Rendering JPG at ' + S.dpi + ' DPI…', false, 0);
    rasterise(tid, S.dpi, {}).then(function (cv) {
      return toBlob(cv, 'image/jpeg', 0.94).then(function (b) {
        download(b, fileStem(tid) + '-bleed-' + S.dpi + 'dpi.jpg');
        status('JPG saved · ' + cv.width + ' × ' + cv.height + ' px');
      });
    }).catch(function (e) { status(e.message, true, 6000); });
  }

  function doPDF() {
    var tid = current, t = TPL[tid], S = state[tid];
    status('Building print PDF…', false, 0);
    rasterise(tid, S.dpi, {}).then(function (cv) {
      return toBlob(cv, 'image/jpeg', 0.95).then(function (b) { return b.arrayBuffer(); })
        .then(function (buf) {
          var pdf = buildPrintPDF({
            trimWmm: t.trim[0], trimHmm: t.trim[1], bleedMm: S.bleed,
            markLenMm: t.kind === 'banner' ? 22 : 5, markGapMm: t.kind === 'banner' ? 6 : 1.5,
            pxW: cv.width, pxH: cv.height, jpeg: new Uint8Array(buf),
            title: 'TCA ' + t.label,
            slug: fileStem(tid) + ' - trim ' + t.trim[0] + 'x' + t.trim[1] + 'mm, bleed ' + S.bleed +
              'mm, ' + S.dpi + 'dpi RGB' + (t.keepout ? ', cassette keep-out ' + t.keepout.bottom + 'mm' : '')
          });
          download(new Blob([pdf], { type: 'application/pdf' }), fileStem(tid) + '-print.pdf');
          status('Print PDF saved · TrimBox ' + t.trim[0] + '×' + t.trim[1] + 'mm, ' + S.bleed + 'mm bleed, crop marks');
        });
    }).catch(function (e) { status(e.message, true, 6000); });

  function doSVG() {
    var tid = current;
    var svg = buildSVG(tid, { guides: false, embedFonts: true });
    download(new Blob([svg], { type: 'image/svg+xml' }), fileStem(tid) + '-editable.svg');
    status('Vector SVG saved — opens in Illustrator, Affinity Designer or Inkscape with live text and named layers.');
  }

  /* trim a layer bitmap to its non-transparent bounds */
  function trimLayer(cx, w, h) {
    var d = cx.getImageData(0, 0, w, h).data;
    var minX = w, minY = h, maxX = -1, maxY = -1;
    for (var y = 0; y < h; y++) {
      var row = y * w * 4;
      for (var x = 0; x < w; x++) {
        if (d[row + x * 4 + 3]) {
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0) return null;
    var lw = maxX - minX + 1, lh = maxY - minY + 1;
    var out = new Uint8Array(lw * lh * 4);
    for (var yy = 0; yy < lh; yy++) {
      var src = ((yy + minY) * w + minX) * 4;
      out.set(d.subarray(src, src + lw * 4), yy * lw * 4);
    }
    return { x: minX, y: minY, w: lw, h: lh, rgba: out };
  }

  function doPSD() {
    var tid = current, t = TPL[tid], S = state[tid], dpi = S.psdDpi;
    var r = t.render(S, t);
    var keys = Object.keys(r.layers).filter(function (k) { return r.layers[k]; });
    keys.push('__guides__');
    var out = [], i = 0;
    status('Building layered PSD — layer 1 of ' + keys.length + '…', false, 0);

    function step() {
      if (i >= keys.length) {
        try {
          var CW = t.trim[0] + S.bleed * 2, CH = t.trim[1] + S.bleed * 2;
          var W = Math.round(CW * dpi / 25.4), H = Math.round(CH * dpi / 25.4);
          status('Compressing PSD…', false, 0);
          var bytes = buildPSD(W, H, out, dpi);
          download(new Blob([bytes], { type: 'image/vnd.adobe.photoshop' }), fileStem(tid) + '-' + dpi + 'dpi-layered.psd');
          status('Layered PSD saved · ' + out.length + ' layers · ' + W + ' × ' + H + ' px');
        } catch (e) { status('PSD failed: ' + e.message, true, 7000); }
        return;
      }
      var k = keys[i];
      status('Building layered PSD — layer ' + (i + 1) + ' of ' + keys.length + ' (' +
        (k === '__guides__' ? 'guides' : k) + ')…', false, 0);
      rasterise(tid, dpi, { only: k, transparent: true }).then(function (cv) {
        var cx = cv.getContext('2d', { willReadFrequently: true });
        var L = trimLayer(cx, cv.width, cv.height);
        cv.width = cv.height = 1;
        if (L) {
          L.name = k === '__guides__' ? 'Guides (non-printing)' : k;
          L.hidden = (k === '__guides__');
          out.push(L);
        }
        i++;
        setTimeout(step, 0);
      }).catch(function (e) { status('PSD failed: ' + e.message, true, 7000); });
    }
    setTimeout(step, 30);
  }

  /* ---------------- tabs, toolbar, help ---------------- */
  function buildTabs() {
    var wrap = $('#tabs'); wrap.innerHTML = '';
    var groups = {};
    ORDER.forEach(function (k) { (groups[TPL[k].group] = groups[TPL[k].group] || []).push(k); });
    Object.keys(groups).forEach(function (g) {
      var gd = el('div', { class: 'tabgroup' });
      gd.appendChild(el('em', null, g));
      groups[g].forEach(function (k) {
        var b = el('button', {
          class: 'tab', role: 'tab', 'data-accent': TPL[k].accent,
          'aria-selected': k === current ? 'true' : 'false',
          onclick: function () { switchTo(k); }
        }, '<span class="swatch"></span>' + TPL[k].label);
        gd.appendChild(b);
      });
      wrap.appendChild(gd);
    });
  }
  function switchTo(k) {
    closeEditor(); current = k;
    buildTabs(); buildPanel(); render(); updateLegend();
    $('#stagewrap').scrollTop = 0;
  }
  function updateLegend() {
    $('#legend').hidden = !showGuides;
    $('#legendKeep').hidden = !TPL[current].keepout;
    $('#legendEye').hidden = !TPL[current].eyeline;
  }

  function helpHTML() {
    return '<h2>Print notes, checks and known limits</h2>' +
      '<p>Everything here is built to the TCA brand book v1.2 and the copy on the TCA site. Read this before sending anything to a printer.</p>' +
      '<h3>Dimensions</h3><ul>' +
      '<li>A5 flyers: 148 × 210mm trim, 3mm bleed (154 × 216mm), 8mm safe margin.</li>' +
      '<li>Pull-up banners: 850 × 2000mm trim, 20mm bleed, 50mm safe margin.</li>' +
      '<li>Banner keep-out: bottom 150mm sits inside the cassette, top 40mm goes into the rail. Both are covered by flat colour so a cut there is invisible.</li>' +
      '<li>The banner guides also mark 900–1600mm from the floor — eye height, and where the QR code sits.</li></ul>' +
      '<h3>Colour</h3><p>Exports are RGB. A browser has no colour-management engine, so an unprofiled CMYK conversion here would be worse than the one your printer does. Send the PDF as RGB and ask them to convert with their own profile, or convert in Acrobat / Affinity to the profile they name (UK litho is usually FOGRA39 / ISO Coated v2; large-format is press-specific). Royal Blue #00247D and Red #CF142B are the reference values — check a proof rather than trusting a screen.</p>' +
      '<h3>Why the PSD is a raster PSD</h3>' +
      '<p>A real, spec-compliant .psd is written here in the browser: RGB, 8-bit, RLE-compressed, with each design element on its own named layer and the guides included as a hidden layer. What it cannot do is carry <em>live</em> Photoshop text or vector shape layers — those need Photoshop’s own object model, which no browser can produce. Text arrives as pixels on its own layer.</p>' +
      '<p>So if you want to re-typeset rather than re-position, use <b>Download editable SVG</b>: it opens in Illustrator, Affinity Designer or Inkscape with live text, real vector shapes and the same named layers, and Photoshop will import it as vector smart objects. That is the closest practical editable source format.</p>' +
      '<h3>Fonts</h3><p>Sora, Inter and Space Mono are embedded in this file and in every export, subset to the characters used, so nothing substitutes at the printer. In the SVG they are embedded as web fonts; in the PDF and JPG they are already rasterised.</p>' +
      '<h3>Copy still to be confirmed by TCA</h3><ul>' +
      '<li><b>Refund amount.</b> The site flags an open question: the working model is a £10 deposit with £8 back and £2 retained. Nothing here claims a full refund. Decide before printing.</li>' +
      '<li><b>Illness and cancellation policy.</b> Not yet set on the site, so it is not claimed here.</li>' +
      '<li><b>Facebook and YouTube.</b> Listed as “coming soon”. Icons are included as requested; the handles are editable and can be cleared.</li>' +
      '<li><b>Session dates and venues.</b> All still to be confirmed, so no template states one.</li></ul>' +
      '<h3>Logo</h3><p>The mark is loaded straight from the brand site and placed unaltered — never recoloured, rotated, cropped or re-set, and never on Royal Blue, Red or a dark surface. Where it appears over photography it sits on its own white card, which the brand book allows. If your browser blocks the fetch, upload the file in the Logo panel.</p>' +
      '<h3>Social icons</h3><p>Drawn to the brand’s own icon rules (24-unit grid, flat single colour) rather than copied from each platform. For a large run, replace them with the official assets from each platform’s brand centre.</p>' +
      '<h3>Before you send</h3><ul>' +
      '<li>Turn the guides on and check nothing important crosses the green safe line.</li>' +
      '<li>Scan the QR from a phone at the distance people will actually stand.</li>' +
      '<li>Check the photo warning reads “Good for print”.</li>' +
      '<li>Open the PDF and confirm the crop marks and the trim size in the document properties.</li></ul>';
  }

  /* ---------------- init ---------------- */
  function init() {
    buildTabs(); buildPanel(); render(); loadLogo();

    /* text wrapping is measured with the real fonts, so wait for them and re-flow */
    if (document.fonts && document.fonts.load) {
      Promise.all([
        '800 20px "TCA Sora"', '700 20px "TCA Sora"', '600 20px "TCA Sora"',
        '400 20px "TCA Inter"', '600 20px "TCA Inter"', '700 20px "TCA Mono"'
      ].map(function (f) { return document.fonts.load(f, 'AaBb0123'); }))
        .then(function () { render(); })
        .catch(function () { });
    }

    $('#guides').addEventListener('change', function (e) {
      showGuides = e.target.checked;
      $('#guideToggle').classList.toggle('on', showGuides);
      updateLegend(); render();
    });
    $('#zoomIn').addEventListener('click', function () { zoom[current] = pxPerMM(current) * 1.25; closeEditor(); render(); });
    $('#zoomOut').addEventListener('click', function () { zoom[current] = pxPerMM(current) / 1.25; closeEditor(); render(); });
    $('#zoomFit').addEventListener('click', function () { zoom[current] = 0; closeEditor(); render(); });
    $('#helpBtn').addEventListener('click', function () {
      $('#helpBody').innerHTML = helpHTML() +
        '<div style="margin-top:16px"><button class="btn" id="closeHelp">Close</button></div>';
      $('#helpDlg').showModal();
      $('#closeHelp').addEventListener('click', function () { $('#helpDlg').close(); });
    });
    window.addEventListener('resize', function () { zoom[current] = 0; closeEditor(); reRender(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeEditor(); });

    /* drag & drop a photo straight onto the artwork */
    var wrap = $('#stagewrap');
    wrap.addEventListener('dragover', function (e) { e.preventDefault(); });
    wrap.addEventListener('drop', function (e) {
      e.preventDefault();
      var f = e.dataTransfer.files[0];
      if (f && /^image\//.test(f.type)) { loadImageFile(f); buildPanel(); }
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
</html>
